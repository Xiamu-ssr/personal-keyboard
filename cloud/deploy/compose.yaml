name: doudou-keyboard-cloud
services:
  api:
    build:
      context: ..
    env_file: cloud.env
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    volumes: ["sync:/data/sync"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    environment:
      UV_THREADPOOL_SIZE: "2"
      NODE_OPTIONS: "--max-old-space-size=384 --v8-pool-size=2"
    pids_limit: 128
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  db:
    image: postgres:17-alpine
    env_file: database.env
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "work_mem=2MB", "-c", "max_connections=20"]
    volumes: ["database:/var/lib/postgresql/data"]
    shm_size: 32m
    mem_limit: 192m
    pids_limit: 80
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyboard -d keyboard"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  database:
  sync:
