<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>豆豆输入法 · 产品规格</title>
    <!-- SPEC_STYLE -->
  </head>
  <body>
    <header class="header">
      <a class="brand" href="#domains"
        ><span class="brand-mark">豆</span
        ><strong>豆豆输入法 <span>产品规格</span></strong></a
      >
      <div class="header-actions">
        <button id="open-native">截图与动画</button><span id="revision"></span>
      </div>
    </header>
    <main id="spec-main">
      <nav id="sections" class="section-tabs" aria-label="规格栏目">
        <button data-section="domains" aria-selected="true" class="active">
          基础域</button
        ><button data-section="business" aria-selected="false">业务图</button>
      </nav>
      <section id="domains-section" aria-label="基础域">
        <div class="section-heading">
          <div>
            <p class="eyebrow">谁负责什么</p>
            <h1>五个域，一套清晰的边界。</h1>
          </div>
          <p class="section-intro">卡片与业务图采用相同颜色。</p>
        </div>
        <div id="domain-cards" class="domain-cards"></div>
        <section class="offer-strip" aria-label="账户权益">
          <div class="offer-label">
            <span class="pill">免费账户</span>
            <h2>新账号，一次性赠送。</h2>
          </div>
          <div class="offer-metric">
            <strong id="free-characters"></strong><span>转写字符</span>
          </div>
          <div class="offer-metric">
            <strong id="free-advisor"></strong><span>次军师生成</span>
          </div>
          <div class="offer-metric">
            <strong>本地</strong><span>历史与个人记忆</span>
          </div>
          <button data-doc="commercial">权益与后台配置 ↗</button>
        </section>
        <div class="domain-footnote">
          <span>付费套餐可含更多用量与产品云同步；价格和额度由后台配置。</span
          ><button data-doc="architecture">App / Cloud / Spec 结构 ↗</button>
        </div>
      </section>
      <section id="business-section" aria-label="业务图" hidden>
        <div class="business-heading">
          <div>
            <p class="eyebrow">从操作到结果</p>
            <h1>业务图</h1>
          </div>
          <nav
            id="workflow-tabs"
            class="workflow-tabs"
            aria-label="选择业务图"
          ></nav>
        </div>
        <div class="workflow-intro">
          <div>
            <h2 id="workflow-title"></h2>
            <p id="workflow-summary"></p>
          </div>
          <div id="domain-legend" class="domain-legend"></div>
        </div>
        <div
          id="graph-scroll"
          class="graph-scroll"
          tabindex="0"
          aria-label="业务图画布，可横向滚动"
        >
          <div id="graph-stage">
            <div class="graph-band main-band">实时任务</div>
            <div class="graph-band memory-band">
              记忆更新
              <span>按新增历史分批，约每 5 小时检查；无新增不调用。</span>
            </div>
            <svg id="flow-wires" aria-label="有向业务关系"></svg>
            <div id="flow-nodes"></div>
          </div>
        </div>
        <div class="graph-footer">
          <span
            ><i></i> 主流程　<span class="dash">┄</span> 可选步骤　<span
              class="dot-line"
              >┄</span
            >
            记忆更新</span
          ><button data-doc="memory-and-sync">本地数据与付费云同步 ↗</button>
        </div>
      </section>
      <footer class="implementation-note">
        <span
          >当前 APK 为原生预览版；图中商业
          Cloud、登录、支付与云同步尚未上线。</span
        ><button data-doc="implementation">查看当前实现 ↗</button>
      </footer>
    </main>
    <div id="panel-shade" hidden></div>
    <aside
      id="inspector"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="步骤与域详情"
    >
      <header class="inspector-top">
        <span id="breadcrumb"></span
        ><button id="close-inspector" aria-label="关闭详情">×</button>
      </header>
      <div id="inspector-heading"></div>
      <div id="inspector-content"></div>
    </aside>
    <dialog id="native-dialog" class="modal">
      <header class="native-toolbar">
        <h2>豆豆输入法</h2>
        <span id="demo-status" hidden></span
        ><a href="./demo/doudou-keyboard.apk" download>下载 APK</a
        ><button
          class="modal-close"
          data-close="native-dialog"
          aria-label="关闭 APK 预览"
        >
          ×
        </button>
      </header>
      <div class="demo-controls">
        <label
          >演示设备<select id="device-select" aria-label="选择已授权的安卓设备">
            <option value="">检查设备…</option>
          </select></label
        ><button id="refresh-devices">刷新</button
        ><button id="prepare-demo">安装并运行</button
        ><button id="stop-demo">停止并恢复</button>
      </div>
      <label class="consent"
        ><input
          id="enable-capture"
          type="checkbox"
        />临时启用输入法和截屏，停止时恢复。</label
      >
      <div id="demo-message" role="status"></div>
      <div class="native-stage">
        <div id="native-placeholder">
          <video
            id="native-video"
            controls
            loop
            muted
            playsinline
            preload="none"
            poster="./demo/typing.png"
            src="./demo/keyboard-tour.mp4"
            aria-label="真实 APK 录屏：拼音输入、工具与语音面板"
          ></video
          ><img
            id="native-image"
            src="./demo/home.png"
            alt="豆豆输入法首页"
            hidden
          />
        </div>
        <iframe
          id="android-frame"
          title="本地设备画面"
          allow="fullscreen"
          hidden
        ></iframe>
      </div>
      <nav id="native-gallery" aria-label="APK 截图与操作录屏">
        <button
          data-video="keyboard-tour.mp4"
          data-poster="typing.png"
          aria-pressed="true"
        >
          <img src="./demo/typing.png" alt="" /><span>打字与语音</span
          ><small>录屏</small></button
        ><button
          data-video="advisor-tour.mp4"
          data-poster="advisor.png"
          aria-pressed="false"
        >
          <img src="./demo/advisor.png" alt="" /><span>军师读屏</span
          ><small>录屏</small></button
        ><button data-image="home.png" aria-pressed="false">
          <img src="./demo/home.png" alt="" /><span>首页</span></button
        ><button data-image="memory.png" aria-pressed="false">
          <img src="./demo/memory.png" alt="" /><span>个人记忆</span></button
        ><button data-image="people.png" aria-pressed="false">
          <img src="./demo/people.png" alt="" /><span>人物</span></button
        ><button data-image="settings.png" aria-pressed="false">
          <img src="./demo/settings.png" alt="" /><span>设置</span>
        </button>
      </nav>
    </dialog>
    <!-- SPEC_DATA --><!-- SPEC_SCRIPT -->
  </body>
</html>
