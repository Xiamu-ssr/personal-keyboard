<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>豆豆输入法 · 产品规格</title>
    <!-- SPEC_STYLE -->
  </head>
  <body>
    <header class="header">
      <a class="brand" href="#domains" aria-label="豆豆输入法基础域"
        ><span class="brand-mark">豆</span><strong>豆豆输入法</strong></a
      >
      <nav id="sections" class="section-tabs" aria-label="规格栏目">
        <button data-section="domains" aria-selected="true" class="active">
          基础域
        </button>
        <button data-section="business" aria-selected="false">业务图</button>
      </nav>
      <nav
        id="workflow-tabs"
        class="workflow-tabs"
        aria-label="选择业务图"
        hidden
      ></nav>
      <div class="header-actions">
        <button id="open-native">截图与动画</button>
      </div>
    </header>
    <main id="spec-main">
      <section id="domains-section" aria-label="基础域">
        <div id="domain-cards" class="domain-cards"></div>
      </section>
      <section id="business-section" aria-label="业务图" hidden>
        <div class="graph-tools" aria-label="画布控制">
          <button id="pause-streams" title="播放模拟世界">▶ 播放</button
          ><button id="step-world" title="推进一个事件">单步</button
          ><button id="reset-world" title="回到开始">↺</button>
          <span class="tool-divider"></span
          ><button id="zoom-out" aria-label="缩小">−</button
          ><span id="zoom-level">100%</span
          ><button id="zoom-in" aria-label="放大">＋</button
          ><button id="zoom-fit">全图</button>
        </div>
        <div class="simulation-label">业务示例 · 非运行记录</div>
        <div
          id="graph-scroll"
          class="graph-scroll"
          tabindex="0"
          aria-label="域与实体画布，可拖动和缩放；点击节点查看详情"
        >
          <div id="graph-size">
            <div id="graph-stage">
              <svg id="flow-wires" aria-label="域之间一来一回的数据通道"></svg>
              <div id="flow-nodes"></div>
              <div id="flow-streams"></div>
            </div>
          </div>
        </div>
        <div class="world-progress">
          <span id="world-event" role="status">点播放，看数据怎么走</span
          ><span id="event-count"></span>
        </div>
      </section>
    </main>
    <div id="panel-shade" hidden></div>
    <aside
      id="inspector"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="域、实体与数据详情"
    >
      <header class="inspector-top">
        <span id="breadcrumb"></span
        ><button id="close-inspector" aria-label="关闭详情">×</button>
      </header>
      <div id="inspector-heading"></div>
      <div id="inspector-content"></div>
    </aside>
    <dialog id="native-dialog" class="modal">
      <header class="native-toolbar">
        <h2>豆豆输入法</h2>
        <span id="demo-status" hidden></span
        ><a href="./demo/doudou-keyboard.apk" download>下载 APK</a
        ><button
          class="modal-close"
          data-close="native-dialog"
          aria-label="关闭 APK 预览"
        >
          ×
        </button>
      </header>
      <div class="demo-controls">
        <label
          >演示设备<select id="device-select" aria-label="选择已授权的安卓设备">
            <option value="">检查设备…</option>
          </select></label
        ><button id="refresh-devices">刷新</button
        ><button id="prepare-demo">安装并运行</button
        ><button id="stop-demo">停止并恢复</button>
      </div>
      <label class="consent"
        ><input
          id="enable-capture"
          type="checkbox"
        />临时启用输入法和截屏，停止时恢复。</label
      >
      <div id="demo-message" role="status"></div>
      <div class="native-stage">
        <div id="native-placeholder">
          <video
            id="native-video"
            controls
            loop
            muted
            playsinline
            preload="none"
            poster="./demo/typing.png"
            src="./demo/keyboard-tour.mp4"
            aria-label="真实 APK 录屏：按住空格、撤回本次语音、松手换行"
          ></video
          ><img
            id="native-image"
            src="./demo/home.png"
            alt="豆豆输入法首页"
            hidden
          />
        </div>
        <iframe
          id="android-frame"
          title="本地设备画面"
          allow="fullscreen"
          hidden
        ></iframe>
      </div>
      <nav id="native-gallery" aria-label="APK 截图与操作录屏">
        <button
          data-video="keyboard-tour.mp4"
          data-poster="typing.png"
          aria-pressed="true"
        >
          <img src="./demo/typing.png" alt="" /><span>语音手势</span
          ><small>录屏</small></button
        ><button
          data-video="advisor-tour.mp4"
          data-poster="advisor.png"
          aria-pressed="false"
        >
          <img src="./demo/advisor.png" alt="" /><span>军师回复</span
          ><small>录屏</small></button
        ><button data-image="home.png" aria-pressed="false">
          <img src="./demo/home.png" alt="" /><span>首页</span></button
        ><button data-image="memory.png" aria-pressed="false">
          <img src="./demo/memory.png" alt="" /><span>个人记忆</span></button
        ><button data-image="people.png" aria-pressed="false">
          <img src="./demo/people.png" alt="" /><span>人物</span></button
        ><button data-image="settings.png" aria-pressed="false">
          <img src="./demo/settings.png" alt="" /><span>我的</span></button
        ><button data-image="account.png" aria-pressed="false">
          <img src="./demo/account.png" alt="" /><span>账户与权益</span>
        </button>
      </nav>
    </dialog>
    <!-- SPEC_DATA --><!-- SPEC_SCRIPT -->
  </body>
</html>
