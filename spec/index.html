    <style>:root {
  --ink: #263343;
  --muted: #6a7c90;
  --line: #d9e3eb;
  --paper: #f6f9fc;
  font-family: Inter, "PingFang SC", "Microsoft Yahei", system-ui, sans-serif;
  color: var(--ink);
  background: #eff4fa;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at 20% 20%, #e5efff, transparent 60%),
    radial-gradient(ellipse at 85% 80%, #f6eee3, transparent 65%), #f1f5fa;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  color: inherit;
  background: #ffffffb8;
  border: 1px solid #d8e2e9;
  border-radius: 10px;
  padding: 7px 12px;
  cursor: pointer;
}
button:hover {
  background: #fff;
  border-color: #b5c9d8;
}

#business-section {

}

.domain-group {

  left: 19px;

  padding: 0;

}
.world-node {

.node-body > strong {

}
.node-body > em {

.group-footer {

.domain-lane {

.domain-lane.streaming {

.traveler {

.packet-stream {
  position: absolute;
  pointer-events: auto;
  outline-offset: -2px;
  touch-action: pan-y;
}
.packet-viewport {
  position: absolute;
  inset: 0;
  perspective: 600px;
  pointer-events: none;
  mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent);
}
.packet-card {
  position: absolute;
  left: 0;
  top: calc(50% - 40px);
  width: 100%;
  height: 80px;
  text-align: left;
  border: 1px solid color-mix(in srgb, var(--packet-color) 32%, #fff);
  border-radius: 13px;
  background: #fffffff5;
  padding: 10px 12px;
  box-shadow: 0 4px 12px #2f4c7020;
  transform: translateY(calc(var(--offset) * 40px))
    scale(calc(1 - var(--distance) * 0.12));
  opacity: calc(1 - var(--distance) * 0.34);
  z-index: calc(5 - var(--distance));
  transition:
    transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
    opacity 0.4s;
  pointer-events: auto;
  overflow: hidden;
}
.packet-card[aria-hidden="true"] {

}

.packet-stream:focus-within .stream-controls {

.packet-stream.empty {

.packet-stream.empty .stream-controls {
  display: none;

#event-count {

  }
  .domain-card {
    padding: 12px;
    gap: 6px;
    border-radius: 16px;
  }
  .card-heading {
    gap: 6px;
  }
  .card-heading > strong {
    font-size: 15px;
  }
  .card-heading > span:last-child {
    font-size: 10px;
  }
  .domain-icon {
    width: 26px;
    height: 26px;
    border-radius: 7px;
  }
  .domain-icon svg {
    width: 18px;
    height: 18px;
  }
  .card-summary {
    font-size: 12px;
    line-height: 1.6;
  }
  .domain-card ul {
    display: none;
  }
  .card-more {
    font-size: 10px;
  }
  .offer-card {
    gap: 5px;
    align-content: flex-start;
  }
  .offer-card .card-heading {
    margin-bottom: 0;
  }
  .offer-number {
    margin-right: 10px;
  }
  .offer-number strong {
    font-size: 24px;
  }
  .offer-number span {
    font-size: 10px;
  }
  .offer-card > p {
    font-size: 10px;
    line-height: 1.6;
  }
  .graph-tools {
    left: 8px;
    top: 8px;
    gap: 0;
  }
  .graph-tools button {
    padding: 5px 7px;
    font-size: 11px;
  }
  .graph-tools span {
    font-size: 10px;
    min-width: 30px;
  }
  .simulation-label {
    font-size: 10px;
    right: 10px;
    top: 48px;
  }
  .graph-scroll {
    inset: 42px 0 44px;
  }
  .world-progress {
    height: 44px;
    padding: 5px 10px;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: space-between;
    font-size: 10px;
  }
  #world-event {
    margin-left: 0;
  }
  #inspector {
    top: 8px;
    right: 8px;
    bottom: 8px;
    max-width: calc(100vw - 16px);
    border-radius: 18px;
  }
  .inspector-top {
    padding: 12px 18px 7px;
  }
  #inspector-heading {
    padding: 5px 18px 12px;
  }
  #inspector-heading h2 {
    font-size: 21px;
  }
  #inspector-content {
    padding: 14px 18px 22px;
  }
  .modal {
    width: calc(100% - 16px);
    max-height: calc(100dvh - 16px);
    border-radius: 18px;
    padding: 14px;
  }
  .native-toolbar {
    top: -14px;
    gap: 9px;
  }
  .native-toolbar h2 {
    font-size: 16px;
  }
  .native-toolbar a {
    font-size: 12px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

function nodeIndex(spec) {
  const index = new Map();
  for (const g of spec.world.groups) {
    const d = spec.domains.find((d) => d.id === g.domain);
    for (const p of g.nodes) {
      const n = d.nodes.find((n) => n.id === p.id);
      index.set(`${d.id}.${n.id}`, { ...n, rect: p.rect, domain: d.id });
    }
  }
  return index;
}
/** Exactly one straight lane per direction, ending at domain boundaries. */
function laneRoute(world, channel, direction) {
  const a = world.groups.find((g) => g.domain === channel.a).rect;
  const b = world.groups.find((g) => g.domain === channel.b).rect;
  const y = channel.lanes[direction];
  return direction === "ab"
    ? [
        [a[0] + a[2], y],
        [b[0], y],
      ]
    : [
        [b[0], y],
        [a[0] + a[2], y],
      ];
}

class PacketHistory {
  constructor(limit = 80) {
    this.limit = limit;
    this.items = [];
    this.index = -1;
    this.follow = true;
    this.sequence = 0;
  }
  append(packet) {
    this.items.push({ ...packet, sequence: ++this.sequence });
    if (this.items.length > this.limit) {
      this.items.shift();
      this.index = Math.max(0, this.index - 1);
    }
    if (this.follow) this.index = this.items.length - 1;
    return this.items.at(-1);
  }
  scroll(delta) {
    this.follow = false;
    this.index = Math.max(
      0,
      Math.min(this.items.length - 1, this.index + delta),
    );
  }
  latest() {
    this.follow = true;
    this.index = this.items.length - 1;
  }

    return this.items
      .map((p, i) => ({ ...p, offset: i - this.index }))

    this.done = this.cursor === this.view.events.length;

      );
    } else if (drag) {
      host.scrollLeft = drag.left - (e.clientX - drag.x);
      host.scrollTop = drag.top - (e.clientY - drag.y);
    }
  });
  const release = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    drag = null;
    if (!pointers.size) host.classList.remove("dragging");
  };
  host.addEventListener("pointerup", release);
  host.addEventListener("pointercancel", release);
  host.addEventListener(
    "wheel",
    (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const r = host.getBoundingClientRect();
        scaleGraph(state.scale * Math.exp(-e.deltaY * 0.005), [
          e.clientX - r.left,
          e.clientY - r.top,
        ]);
      }
    },
    { passive: false },
  );
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      if (state.section === "business") fitGraph(true);
    });
  }).observe(host);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pause();
  });
  window.addEventListener("hashchange", route);
  route();
})();

(function () {
  const data = JSON.parse(document.getElementById("spec-data").textContent);
  const el = (id) => document.getElementById(id);
  const mediaAsset = (name) => "./demo/" + name + "?v=" + encodeURIComponent(data.meta.version);
  const text = (s) =>
    String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/"/g, "&quot;");
  let token = "",
    current = null;
  const local =
    location.protocol === "http:" &&
    ["127.0.0.1", "localhost"].includes(location.hostname);
  document.body.dataset.specMode = local ? "local" : "static";
  async function api(path, body) {
    const r = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json", "X-Demo-Token": token },
      body: body ? JSON.stringify(body) : undefined,
    });
    const d = await r.json();
    if (!r.ok) throw Error(d.error || "本地服务异常");
    return d;
  }
  function status(label) {
    el("demo-status").textContent = label;
  }
  function showFrame(url) {
    el("native-video").pause();
    el("native-placeholder").hidden = !!url;
    el("native-gallery").hidden = !!url;
    el("android-frame").hidden = !url;
    if (url) el("android-frame").src = url;
    else el("android-frame").removeAttribute("src");
  }
  async function refresh() {
    if (!local) {
      status("实机截图");
      el("device-select").closest(".demo-controls").hidden = true;
      el("enable-capture").closest(".consent").hidden = true;
      el("demo-message").hidden = true;
      return;
    }
    try {
      const s = await api("/api/session");
      token = s.token;
      const d = await api("/api/demo/status");
      current = d;
      el("device-select").innerHTML = d.devices.length
        ? d.devices
            .map(
              (x) =>
                '<option value="' +
                text(x.serial) +
                '">' +
                text(x.label) +
                "</option>",
            )
            .join("")
        : '<option value="">没有已授权设备</option>';
      status(d.running ? "Android 画面已连接" : "本地服务在线");
      if (d.running) showFrame(d.viewerUrl);
    } catch (e) {
      status("本地服务离线");
      el("demo-message").textContent = e.message;
    }
  }
  async function action(which) {
    if (!local) return;
    const buttons = [el("prepare-demo"), el("stop-demo")];
    buttons.forEach((b) => (b.disabled = true));
    try {
      if (which === "start") {
        status("正在准备 Android…");
        const d = await api("/api/demo/start", {
          serial: el("device-select").value,
          enableCapture: el("enable-capture").checked,
        });
        showFrame(d.viewerUrl);
        status("真实 Android 画面");
        el("demo-message").textContent = d.message;
      } else {
        await api("/api/demo/stop", {});
        showFrame(null);
        status("演示已停止");
        el("demo-message").textContent =
          "已恢复本次临时切换的输入法/读屏设置，未关闭用户设备。";
      }
    } catch (e) {
      status("需要处理");
      el("demo-message").textContent = e.message;
    } finally {
      buttons.forEach((b) => (b.disabled = false));
    }
  }
  el("refresh-devices").addEventListener("click", refresh);
  el("prepare-demo").addEventListener("click", () => action("start"));
  el("stop-demo").addEventListener("click", () => action("stop"));
  refresh();
  const video = el("native-video");
  const still = el("native-image");
  function playPreview() {
    if (!video.hidden && !matchMedia("(prefers-reduced-motion: reduce)").matches)
      video.play().catch(() => {});
  }
  el("native-gallery").querySelectorAll("button").forEach((button) => {
    button.addEventListener("click", () => {
      video.pause();
      el("native-gallery").querySelectorAll("button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b === button)),
      );
      const movie = button.dataset.video;
      video.hidden = !movie;
      still.hidden = !!movie;
      if (movie) {
        video.poster = mediaAsset(button.dataset.poster);
        video.src = mediaAsset(movie);
        video.setAttribute("aria-label", "真实 APK 录屏：" + button.querySelector("span").textContent);
        playPreview();
      } else {
        still.src = mediaAsset(button.dataset.image);
        still.alt = "豆豆输入法 · " + button.querySelector("span").textContent;
      }
    });
  });
  el("native-dialog").addEventListener("spec:open", () => {
    if (!local) playPreview();
  });
  el("native-dialog").addEventListener("close", () => {
    video.pause();
    if (location.hash === "#demo")
      history.replaceState(null, "", location.pathname + location.search);
  });
  if (location.hash === "#demo" && !local) {
    el("native-dialog").showModal();
    playPreview();
  }
})();
</script>
  </body>
