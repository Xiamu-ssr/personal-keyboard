<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>豆豆输入法 · 产品规格</title>
    <style>:root {
  --ink: #263343;
  --muted: #6a7c90;
  --line: #d9e3eb;
  --paper: #f6f9fc;
  font-family: Inter, "PingFang SC", "Microsoft Yahei", system-ui, sans-serif;
  color: var(--ink);
  background: #eff4fa;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at 20% 20%, #e5efff, transparent 60%),
    radial-gradient(ellipse at 85% 80%, #f6eee3, transparent 65%), #f1f5fa;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  color: inherit;
  background: #ffffffb8;
  border: 1px solid #d8e2e9;
  border-radius: 10px;
  padding: 7px 12px;
  cursor: pointer;
}
button:hover {
  background: #fff;
  border-color: #b5c9d8;
}
button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid #548bbb;
  outline-offset: 3px;
}
button:disabled {
  opacity: 0.4;
  cursor: default;
}
a {
  color: #38718d;
}
h1,
h2,
h3,
p {
  margin: 0;
}
[hidden] {
  display: none !important;
}
.muted {
  color: var(--muted);
}
.header {
  height: 54px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 18px;
  border-bottom: 1px solid #d2dce95c;
  background: #ffffff80;
  z-index: 8;
  backdrop-filter: blur(14px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  white-space: nowrap;
  text-decoration: none;
  color: var(--ink);
}
.brand strong {
  font-size: 15px;
  letter-spacing: 0.03em;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  border-radius: 9px;
  color: #fff;
  background: #54877e;
  font-size: 15px;
}
.section-tabs,
.workflow-tabs {
  display: flex;
  align-items: center;
  gap: 3px;
}
.section-tabs {
  border: 1px solid #d8e1eb80;
  background: #e7edf47a;
  border-radius: 10px;
  padding: 3px;
}
.section-tabs button {
  font-size: 13px;
  border: 0;
  background: none;
  padding: 5px 14px;
  border-radius: 7px;
  white-space: nowrap;
}
.section-tabs button.active {
  background: #fff;
  color: #256a62;
  box-shadow: 0 1px 5px #263c5310;
}
.workflow-tabs {
  border-left: 1px solid #ccd9e5;
  padding-left: 16px;
}
.workflow-tabs button {
  font-size: 13px;
  border: 0;
  background: transparent;
  white-space: nowrap;
  padding: 7px 11px;
}
.workflow-tabs button[aria-pressed="true"] {
  background: #dce9efad;
  color: #315e70;
}
.header-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
}
.header-actions button {
  border: 0;
  background: transparent;
  padding: 6px 9px;
  font-size: 12px;
  white-space: nowrap;
}
#spec-main {
  flex: 1;
  min-height: 0;
  position: relative;
}
#domains-section {
  height: 100%;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.domain-cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: 18px;
  width: min(1320px, 100%);
  height: min(680px, 100%);
}
.domain-card {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  padding: 23px 25px;
  border: 1px solid color-mix(in srgb, var(--domain) 35%, #fff);
  border-radius: 22px;
  background: color-mix(in srgb, var(--domain) 3%, #fafcfff5);
  box-shadow: 0 4px 18px #3c568108;
}
.domain-card:hover {
  border-color: var(--domain);
  transform: translateY(-1px);
  background: #ffffffdb;
}
.card-heading {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  flex: none;
}
.card-heading > strong {
  font-size: 21px;
}
.card-heading > span:last-child {
  margin-left: auto;
  font-size: 12px;
  color: var(--domain);
}
.domain-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  color: var(--domain);
  background: color-mix(in srgb, var(--domain) 9%, transparent);
  flex: none;
}
.domain-icon svg {
  width: 23px;
  height: 23px;
  stroke: currentColor;
  stroke-width: 1.6;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.card-summary {
  font-size: 15px;
  line-height: 1.7;
  color: var(--muted);
}
.domain-card ul {
  padding-left: 17px;
  margin: 0;
  font-size: 14px;
  line-height: 1.85;
}
.card-more {
  margin-top: auto;
  display: block;
  font-size: 12px;
  color: var(--domain);
}
.offer-card {
  flex-direction: row;
  flex-wrap: wrap;
  align-content: flex-start;
}
.offer-card .card-heading {
  width: 100%;
  margin-bottom: 2px;
}
.offer-number {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-right: 20px;
}
.offer-number strong {
  font-size: 34px;
  font-weight: 570;
  letter-spacing: -0.04em;
}
.offer-number span,
.offer-card > p {
  font-size: 13px;
  color: var(--muted);
}
.offer-card > p {
  width: 100%;
  line-height: 1.8;
}
.offer-card > .card-more {
  width: 100%;
  margin-top: auto;
  align-self: flex-end;
}
#business-section {
  height: 100%;
  position: relative;
  overflow: hidden;
}
.graph-tools {
  position: absolute;
  top: 10px;
  left: 15px;
  z-index: 7;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid #d8e2ea;
  background: #fbfdfff2;
  box-shadow: 0 3px 14px #4f668112;
  border-radius: 11px;
}
.graph-tools button {
  font-size: 12px;
  padding: 5px 9px;
  border: 0;
  background: transparent;
  white-space: nowrap;
}
.graph-tools button:hover {
  background: #e8f0f7;
}
.graph-tools span {
  font-size: 11px;
  min-width: 34px;
  text-align: center;
  color: #74889b;
}
.graph-tools .tool-divider {
  min-width: 1px;
  height: 15px;
  background: #dae3eb;
  margin: 0 4px;
}
.simulation-label {
  position: absolute;
  right: 18px;
  top: 20px;
  z-index: 6;
  font-size: 11px;
  color: #8292a1;
  pointer-events: none;
}
.graph-scroll {
  position: absolute;
  inset: 42px 0 33px;
  overflow: auto;
  scrollbar-width: none;
  overscroll-behavior: contain;
  touch-action: none;
  cursor: grab;
  display: block;
  outline-offset: -4px;
}
.graph-scroll::-webkit-scrollbar {
  display: none;
}
.graph-scroll.dragging {
  cursor: grabbing;
  user-select: none;
}
#graph-size {
  position: relative;
  margin: auto;
  flex: none;
}
#graph-stage {
  position: relative;
  transform-origin: top left;
}
#flow-wires,
#flow-nodes,
#flow-streams {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#flow-wires {
  z-index: 1;
  overflow: visible;
  pointer-events: none;
}
#flow-nodes {
  pointer-events: none;
}
#flow-streams {
  z-index: 5;
  pointer-events: none;
}
.domain-group {
  position: absolute;
  border: 0;
  outline: 1.5px solid color-mix(in srgb, var(--domain) 42%, #fff);
  border-radius: 25px;
  background: color-mix(in srgb, var(--domain) 3%, #fbfdfff0);
  box-shadow: 0 6px 25px #283d6605;
}
.group-heading {
  position: absolute;
  top: 17px;
  left: 19px;
  right: 16px;
  display: flex;
  align-items: center;
  gap: 9px;
  border: 0;
  background: transparent;
  padding: 0;
  z-index: 3;
  pointer-events: auto;
}
.group-heading .domain-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
}
.group-heading .domain-icon svg {
  width: 21px;
  height: 21px;
}
.group-heading strong {
  font-size: 22px;
  white-space: nowrap;
}
.group-heading > span:last-child {
  margin-left: auto;
  color: var(--domain);
  opacity: 0.6;
  font-size: 14px;
}
.world-node {
  position: absolute;
  border: 0;
  outline: 1.4px solid color-mix(in srgb, var(--domain) 24%, #e2eaf1);
  border-radius: 15px;
  background: #fff;
  box-shadow: 0 3px 12px #314b5d05;
  z-index: 3;
  pointer-events: auto;
  transition:
    border-color 0.25s,
    box-shadow 0.25s;
}
.world-node.current {
  outline-color: var(--domain);
  box-shadow:
    0 0 0 3px color-mix(in srgb, var(--domain) 10%, transparent),
    0 4px 16px #34527612;
}
.node-body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: 7px;
  width: 100%;
  height: 100%;
  padding: 12px 14px;
  border: 0;
  background: transparent !important;
  border-radius: inherit;
  text-align: left;
  position: relative;
}
.node-body > strong {
  font-size: 20px;
  font-weight: 620;
  line-height: 1.3;
}
.node-body > span {
  font-size: 13px;
  line-height: 1.45;
  color: var(--muted);
}
.node-body > em {
  font-size: 13px;
  color: var(--domain);
  font-style: normal;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.node-body > em:empty {
  display: none;
}
.world-node.has-state .node-body > span {
  display: none;
}
.node-body > small {
  font-size: 11px;
  color: var(--domain);
  line-height: 1;
}
.group-footer {
  position: absolute;
  bottom: 17px;
  left: 22px;
  color: var(--domain);
  font-size: 11px;
  opacity: 0.7;
}
.domain-lane {
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  opacity: 0.6;
}
.domain-lane.active {
  opacity: 1;
  stroke-width: 2.6;
}
.domain-lane.streaming {
  opacity: 0.85;
  stroke-dasharray: 5 7;
}
[data-playing="true"] .domain-lane.streaming,
[data-playing="true"] .domain-lane.active {
  animation: flow 1.1s linear infinite;
}
.traveler {
  filter: drop-shadow(0 0 5px #fff);
}
@keyframes flow {
  to {
    stroke-dashoffset: -22;
  }
}
.packet-stream {
  position: absolute;
  pointer-events: auto;
  outline-offset: -2px;
  touch-action: pan-y;
}
.packet-viewport {
  position: absolute;
  inset: 0;
  perspective: 600px;
  pointer-events: none;
  mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent);
}
.packet-card {
  position: absolute;
  left: 0;
  top: calc(50% - 40px);
  width: 100%;
  height: 80px;
  text-align: left;
  border: 1px solid color-mix(in srgb, var(--packet-color) 32%, #fff);
  border-radius: 13px;
  background: #fffffff5;
  padding: 10px 12px;
  box-shadow: 0 4px 12px #2f4c7020;
  transform: translateY(calc(var(--offset) * 40px))
    scale(calc(1 - var(--distance) * 0.12));
  opacity: calc(1 - var(--distance) * 0.34);
  z-index: calc(5 - var(--distance));
  transition:
    transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
    opacity 0.4s;
  pointer-events: auto;
  overflow: hidden;
}
.packet-card[aria-hidden="true"] {
  pointer-events: none;
}
.packet-card > span {
  display: flex;
  gap: 3px;
  align-items: center;
  color: var(--packet-color);
  font-size: 9px;
  white-space: nowrap;
}
.packet-card > span i {
  font-style: normal;
  margin-left: auto;
  color: #91a1b0;
}
.packet-card > strong {
  display: block;
  font-size: 16px;
  line-height: 1.6;
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.packet-card > p {
  font-size: 10px;
  color: #7c8a96;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.stream-controls {
  position: absolute;
  bottom: -20px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  font-size: 10px;
  color: #7c8c9d;
  opacity: 0;
  transition: opacity 0.2s;
}
.stream-controls button {
  font-size: 12px;
  background: #ffffffb5;
  padding: 1px 6px;
  border-radius: 5px;
}
.packet-stream:hover .stream-controls,
.packet-stream:focus-within .stream-controls {
  opacity: 1;
}
.packet-stream.empty {
  pointer-events: none;
}
.packet-stream.empty .stream-controls {
  display: none;
}
.stream-live {
  position: absolute;
  left: 30px;
  right: 30px;
  bottom: -44px;
  border-color: #cbdde8;
  background: #fff;
  font-size: 10px;
  padding: 4px;
  z-index: 6;
}
.world-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 33px;
  border-top: 1px solid #d0dce766;
  background: #f8fbfbd6;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 18px;
  font-size: 11px;
  color: #7b8da0;
  z-index: 6;
}
#world-event {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
#event-count {
  flex: none;
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}
#panel-shade {
  position: fixed;
  inset: 0;
  background: #26333f24;
  backdrop-filter: blur(2px);
  z-index: 19;
}
#inspector {
  position: fixed;
  top: 18px;
  right: 18px;
  bottom: 18px;
  width: 480px;
  max-width: calc(100vw - 36px);
  border: 1px solid #fff;
  border-radius: 23px;
  background: #f9fbfef5;
  box-shadow: 0 16px 80px #152a4a30;
  z-index: 20;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.inspector-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 19px 24px 12px;
  font-size: 12px;
  color: var(--muted);
}
.inspector-top > button {
  border: 0;
  background: none;
  padding: 0 3px;
  font-size: 28px;
  color: #718292;
}
#inspector-heading {
  padding: 5px 25px 20px;
  border-bottom: 1px solid var(--line);
}
#inspector-heading h2 {
  font-size: 25px;
  line-height: 1.4;
}
#inspector-heading p {
  font-size: 14px;
  line-height: 1.8;
  color: var(--muted);
  margin-top: 9px;
}
#inspector-content {
  overflow: auto;
  padding: 22px 25px 30px;
  overscroll-behavior: contain;
  font-size: 14px;
  line-height: 1.85;
}
.detail-section {
  margin-bottom: 25px;
}
.detail-section h3 {
  font-size: 12px;
  color: #7a8a9c;
  margin-bottom: 10px;
}
.detail-section ul {
  padding-left: 18px;
  margin: 0;
}
.detail-section li {
  margin: 7px 0;
}
.detail-section code {
  font-size: 12px;
  overflow-wrap: anywhere;
  background: #eef3f7;
  padding: 3px 5px;
  border-radius: 4px;
}
.detail-section .code-list {
  display: grid;
  gap: 8px;
}
.packet-fields { margin: 0; }
.packet-fields > div { display: grid; grid-template-columns: minmax(70px, auto) minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.packet-fields dt { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; max-width: 126px; }
.packet-fields dd { margin: 0; overflow-wrap: anywhere; }
.prompt-text { padding: 14px; border-radius: 12px; background: #eef2f8; }
.record-example { padding: 14px; border-radius: 12px; background: #eef2f8; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.detail-section .record-example code { font-size: 13px; line-height: 1.65; padding: 0; background: none; }
.model-reference { font-size: 13px; }
.modal {
  width: min(1100px, calc(100% - 36px));
  max-height: calc(100dvh - 36px);
  border: 1px solid #fff;
  border-radius: 22px;
  background: #f8fbfd;
  color: var(--ink);
  padding: 22px;
  box-shadow: 0 20px 90px #22385130;
}
.modal::backdrop {
  background: #24344654;
  backdrop-filter: blur(3px);
}
.native-toolbar {
  display: flex;
  align-items: center;
  gap: 15px;
  position: sticky;
  top: -22px;
  z-index: 3;
  background: #f8fbfdf5;
  padding: 4px 0 13px;
}
.native-toolbar h2 {
  font-size: 21px;
  margin-right: auto;
}
.native-toolbar a {
  font-size: 14px;
}
.modal-close {
  font-size: 25px;
  padding: 3px 10px;
  border: 0;
  background: none;
}
.demo-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin: 14px 0;
}
.demo-controls label {
  font-size: 13px;
}
.consent {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  margin: 12px 0;
}
.native-stage {
  display: grid;
  place-items: center;
  background: #eef2f6;
  border-radius: 16px;
  margin: 12px 0;
  min-height: 230px;
}
.native-stage iframe {
  border: 0;
  width: 100%;
  height: 620px;
}
#native-placeholder {
  width: 100%;
  display: grid;
  place-items: center;
  padding: 18px;
}
#native-video,
#native-image {
  display: block;
  max-width: 100%;
  width: auto;
  max-height: 65dvh;
  border-radius: 23px;
  border: 1px solid #b8c4cc;
}
#native-gallery {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 5px 0 3px;
}
#native-gallery button {
  width: 115px;
  flex: none;
  padding: 8px;
  border-radius: 12px;
  text-align: left;
  position: relative;
  background: white;
}
#native-gallery button[aria-pressed="true"] {
  border-color: #49877a;
  background: #edf4f0;
}
#native-gallery img {
  height: 65px;
  width: 100%;
  object-fit: cover;
  object-position: center 40%;
  border-radius: 6px;
}
#native-gallery span {
  display: block;
  font-size: 12px;
  margin-top: 5px;
}
#native-gallery small {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 10px;
  background: #233c43bc;
  color: white;
  border-radius: 4px;
  padding: 1px 4px;
}
@media (max-height: 720px) and (min-width: 700px) {
  #domains-section {
    padding: 16px 20px;
  }
  .domain-cards {
    gap: 13px;
  }
  .domain-card {
    padding: 15px 20px;
    gap: 9px;
  }
  .domain-card ul {
    font-size: 12px;
    line-height: 1.7;
  }
  .card-heading > strong {
    font-size: 18px;
  }
  .card-summary {
    font-size: 13px;
  }
  .domain-icon {
    width: 30px;
    height: 30px;
  }
  .offer-number strong {
    font-size: 28px;
  }
}
@media (max-width: 1000px) {
  .header {
    gap: 10px;
    padding: 0 12px;
  }
  .brand strong {
    font-size: 13px;
  }
  .section-tabs button {
    padding: 5px 9px;
  }
  .workflow-tabs {
    padding-left: 8px;
  }
  .workflow-tabs button {
    padding: 6px 8px;
  }
  .header-actions button {
    font-size: 11px;
    padding: 6px;
  }
  .domain-cards {
    gap: 12px;
  }
  .domain-card {
    padding: 16px;
    gap: 10px;
  }
  .card-heading {
    gap: 8px;
  }
  .card-heading > strong {
    font-size: 18px;
  }
  .domain-card ul {
    font-size: 12px;
  }
  .card-summary {
    font-size: 13px;
  }
}

function nodeIndex(spec) {
  const index = new Map();
  for (const g of spec.world.groups) {
    const d = spec.domains.find((d) => d.id === g.domain);
    for (const p of g.nodes) {
      const n = d.nodes.find((n) => n.id === p.id);
      index.set(`${d.id}.${n.id}`, { ...n, rect: p.rect, domain: d.id });
    }
  }
  return index;
}
/** Exactly one straight lane per direction, ending at domain boundaries. */
function laneRoute(world, channel, direction) {
  const a = world.groups.find((g) => g.domain === channel.a).rect;
  const b = world.groups.find((g) => g.domain === channel.b).rect;
  const y = channel.lanes[direction];
  return direction === "ab"
    ? [
        [a[0] + a[2], y],
        [b[0], y],
      ]
    : [
        [b[0], y],
        [a[0] + a[2], y],
      ];
}

  const need = (v, m) => {

    colors.add(d.color);

        "Duplicate or incomplete entity",

      if (n.format)
        need(
          n.format.fields &&
            Object.values(n.format.fields).every((v) => typeof v === "string") &&
            n.format.example && typeof n.format.example === "object",
          "Record formats require fields and a structured example",

          n.reference.title && /^https:\/\//.test(n.reference.url),

      domains.has(g.domain) && !placed.has(g.domain),

    placed.add(g.domain);
    const [x, y, width, height] = g.rect;

    const entities = domains.get(g.domain).nodes || [];
    need(

  }
  need(!w.edges, "No internal workflow wiring");
  need(
    spec.businesses.length === 3 &&
      spec.businesses.map((v) => v.id).join(",") === "voice,advisor,learning",
    "Voice, advisor and memory business views required",
  );
  for (const view of spec.businesses) {

    for (const e of view.events) {

      );
      need(

/** Reading older cards neither advances the example nor jumps to new arrivals. */
class PacketHistory {
  constructor(limit = 80) {
    this.limit = limit;
    this.items = [];
    this.index = -1;
    this.follow = true;
    this.sequence = 0;
  }
  append(packet) {
    this.items.push({ ...packet, sequence: ++this.sequence });
    if (this.items.length > this.limit) {
      this.items.shift();
      this.index = Math.max(0, this.index - 1);
    }
    if (this.follow) this.index = this.items.length - 1;
    return this.items.at(-1);
  }
  scroll(delta) {
    this.follow = false;
    this.index = Math.max(
      0,
      Math.min(this.items.length - 1, this.index + delta),
    );
  }
  latest() {
    this.follow = true;
    this.index = this.items.length - 1;
  }
  visible() {
    return this.items
      .map((p, i) => ({ ...p, offset: i - this.index }))
      .filter((p) => Math.abs(p.offset) <= 2);
  }
}
/** A single example clock updates data, never the domain topology. */
class ProductWorld {
  constructor(world, view) {
    this.world = world;
    this.view = view;
    this.reset();
  }
  reset() {
    this.cursor = 0;
    this.current = null;
    this.done = false;
    this.status = {};
    this.seen = new Set();
    this.activeStreams = new Set();
    this.journal = [];
    this.channels = new Map(
      this.world.channels.map((c) => [c.id, new PacketHistory()]),
    );
  }
  step() {
    const e = this.view.events[this.cursor];
    if (!e) {
      this.done = true;
      return null;
    }
    if (!(e.after || []).every((id) => this.seen.has(id)))
      throw Error("Missing prerequisite");
    const c = this.world.channels.find((c) => c.id === e.channel);
    const packet = {
      ...e,
      from: c ? (e.direction === "ab" ? c.a : c.b) : undefined,
      to: c ? (e.direction === "ab" ? c.b : c.a) : undefined,
    };
    if (c) this.channels.get(c.id).append(packet);
    Object.assign(this.status, e.status || {});
    for (const id of e.startStreams || []) this.activeStreams.add(id);
    for (const id of e.stopStreams || []) this.activeStreams.delete(id);
    this.current = packet;
    this.journal.push(packet);
    this.seen.add(e.id);
    this.cursor++;
    this.done = this.cursor === this.view.events.length;
    return packet;
  }
}

        ? d.devices
            .map(
              (x) =>
                '<option value="' +
                text(x.serial) +
                '">' +
                text(x.label) +
                "</option>",
            )
            .join("")
        : '<option value="">没有已授权设备</option>';
      status(d.running ? "Android 画面已连接" : "本地服务在线");
      if (d.running) showFrame(d.viewerUrl);
    } catch (e) {
      status("本地服务离线");
      el("demo-message").textContent = e.message;
    }
  }
  async function action(which) {
    if (!local) return;
    const buttons = [el("prepare-demo"), el("stop-demo")];
    buttons.forEach((b) => (b.disabled = true));
    try {
      if (which === "start") {
        status("正在准备 Android…");
        const d = await api("/api/demo/start", {
          serial: el("device-select").value,
          enableCapture: el("enable-capture").checked,
        });
        showFrame(d.viewerUrl);
        status("真实 Android 画面");
        el("demo-message").textContent = d.message;
      } else {
        await api("/api/demo/stop", {});
        showFrame(null);
        status("演示已停止");
        el("demo-message").textContent =
          "已恢复本次临时切换的输入法/读屏设置，未关闭用户设备。";
      }
    } catch (e) {
      status("需要处理");
      el("demo-message").textContent = e.message;
    } finally {
      buttons.forEach((b) => (b.disabled = false));
    }
  }
  el("refresh-devices").addEventListener("click", refresh);
  el("prepare-demo").addEventListener("click", () => action("start"));
  el("stop-demo").addEventListener("click", () => action("stop"));
  refresh();
  const video = el("native-video");
  const still = el("native-image");
  function playPreview() {
    if (!video.hidden && !matchMedia("(prefers-reduced-motion: reduce)").matches)
      video.play().catch(() => {});
  }
  el("native-gallery").querySelectorAll("button").forEach((button) => {
    button.addEventListener("click", () => {
      video.pause();
      el("native-gallery").querySelectorAll("button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b === button)),
      );
      const movie = button.dataset.video;
      video.hidden = !movie;
      still.hidden = !!movie;
      if (movie) {
        video.poster = mediaAsset(button.dataset.poster);
        video.src = mediaAsset(movie);
        video.setAttribute("aria-label", "真实 APK 录屏：" + button.querySelector("span").textContent);
        playPreview();
      } else {
        still.src = mediaAsset(button.dataset.image);
        still.alt = "豆豆输入法 · " + button.querySelector("span").textContent;
      }
    });
  });
  el("native-dialog").addEventListener("spec:open", () => {
    if (!local) playPreview();
  });
  el("native-dialog").addEventListener("close", () => {
    video.pause();
    if (location.hash === "#demo")
      history.replaceState(null, "", location.pathname + location.search);
  });
  if (location.hash === "#demo" && !local) {
    el("native-dialog").showModal();
    playPreview();
  }
})();
</script>
  </body>
</html>
