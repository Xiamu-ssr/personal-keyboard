<main id="design-review" hidden aria-labelledby="design-title">
  <div class="dr-heading">
    <div>
      <span class="overline">INTERFACE STUDY · 01</span>
      <h2 id="design-title">界面对稿</h2>
      <p>同一套键盘，同一个 App。直接点手机，试试每一步。</p>
    </div>
    <div class="dr-tools">
      <label
        >画布<select id="dr-size" aria-label="手机逻辑尺寸">
          <option value="393,872">393 × 872</option>
          <option value="360,800">360 × 800</option>
          <option value="412,915">412 × 915</option>
        </select></label
      >
      <label
        >显示<select id="dr-zoom" aria-label="画布显示比例">
          <option value="fit">适应窗口</option>
          <option value="1">100%</option>
        </select></label
      >
      <button id="dr-guides" aria-pressed="false">间距标尺</button>
      <button id="dr-reset">重置演示</button>
    </div>
  </div>
  <div class="dr-workbench">
    <nav id="dr-pages" class="dr-pages" aria-label="设计页面"></nav>
    <section class="dr-stage" aria-label="手机设计预览">
      <div class="dr-stage-top">
        <span id="dr-scene-title"></span><span id="dr-scale-label"></span>
      </div>
      <div class="dr-phone-area" id="dr-phone-area">
        <div id="dr-phone-space">
          <div id="dr-phone" class="dr-phone">
            <div id="dr-screen" class="pk-screen"></div>
          </div>
        </div>
      </div>
      <div class="dr-stage-bottom">
        <span>HTML 交互稿 · 演示数据</span
        ><span id="dr-dimensions">393 × 872 CSS px</span>
      </div>
    </section>
    <aside class="dr-notes" aria-label="当前页面设计说明">
      <div class="dr-note-kicker">这一屏，看什么</div>
      <h3 id="dr-note-title"></h3>
      <p id="dr-note-copy"></p>
      <div
        id="dr-state-controls"
        class="dr-state-controls"
        aria-label="演示阶段"
      ></div>
      <div id="dr-tokens" class="dr-tokens"></div>
      <div class="dr-note-divider"></div>
      <h4>参考与取舍</h4>
      <p>
        参考你提供的
        Typeless：深色层级、错列键位、候选行复用、悬浮底栏。军师与人物记忆沿用我们的业务约定。
      </p>
      <p class="dr-footnote">
        尺寸为逻辑 CSS 像素，100%
        表示不缩放；实际物理大小取决于设备密度。当前可对齐布局与操作，键盘手感和读屏仍待真机。
      </p>
      <button data-doc="design" class="dr-contract-link">
        查看交互与尺寸约定 ↗
      </button>
    </aside>
  </div>
  <p id="dr-announcement" class="dr-announcement" aria-live="polite"></p>
</main>
