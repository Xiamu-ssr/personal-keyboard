        from: app.observer.snapshot
        to: app.difference.snapshot
        title: 前后文本与范围
        detail: 比较 insertedText 与 lastObservedText；不拿 LLM 自己的润色充当用户纠正。
      - id: difference
        from: app.difference.evidence
        to: app.history.evidence
        title: 关联差异证据
        detail: 保存 diff hunks、原记录 ID、范围、观察时间和 finality；分类尚未发生。
      - id: increment
        from: app.history.increment
        to: app.batch.increment
        title: 未整理增量
        detail: 到五小时检查点取水位之后的记录；长文本分片，成功后推进断点。
        via:
