  - id: advisor
    name: 军师模式
    summary: 缩矮 → 本地 OCR → 带人物上下文生成 → 三种建议 → 用户填入。
    width: 1160
    height: 910
    nodes:
      - id: a_screen
        domain: phone
        title: 01 · 当前聊天
        summary: 保持现有聊天和未发送草稿。
        rect:
          - 30
          - 80
          - 220
          - 124
        input: 用户主动点击军师
        output: 当前屏幕与编辑器状态
        rules: []
        prompts: []
        documents: []
      - id: a_capture
        domain: app
        title: 02 · 缩矮并读屏
        summary: 布局稳定后截屏；本机 OCR。
        rect:
          - 310
          - 80
          - 220
          - 124
        input: 当前可见聊天、用户许可
        output: 带位置 / 置信度的 OCR 文字
        rules:
          - 截图不保存到长期历史。
          - 保护窗口失败可恢复；不假装读到内容。
        prompts: []
        documents:
          - interaction
      - id: a_context
        domain: app
        title: 03 · 确认人物与意图
        summary: 取相关热词、文风和人物记忆。
        rect:
          - 590
          - 80
          - 220
          - 124
        input: OCR、联系人、用户意图与本地资料
        output: 限定人物范围的任务上下文
        rules:
          - 身份不明不写人物事实。
          - 用户陈述不冒充对方原话。
        prompts: []
        documents: []
      - id: a_gate
        domain: cloud
        title: 04 · 预留军师次数
        summary: 鉴权与任务去重，预留 1 次。
        rect:
          - 870
          - 80
          - 220
          - 124
        input: 产品会话、requestId、OCR 和意图
        output: 可以执行的一次军师任务
        rules:
          - 更多使用新任务 ID；原任务重试不重扣。
        prompts: []
        documents:
          - commercial
      - id: a_prompt
        domain: cloud
        title: 05 · 军师提示词
        summary: 三种风格，同一意图，不替用户承诺。
        rect:
          - 870
          - 270
          - 220
          - 124
        input: 用户意图、OCR、热词 / 文风、人物记忆
        output: 版本化提示词＋结构化模型请求
        rules:
          - Cloud 持有系统提示词；聊天只作资料。
        prompts:
          - reply
        documents: []
      - id: a_model
        domain: provider
        title: 06 · 文字模型
        summary: 一次返回三个风格，各一条。
        rect:
          - 590
          - 270
          - 220
          - 124
        input: Cloud 组装的军师请求
        output: 结构化 ReplySet＋usage
        rules: []
        prompts: []
        documents: []
      - id: a_result
        domain: cloud
        title: 07 · 校验与结算
        summary: 成功扣 1 次；失败释放预留。
        rect:
          - 310
          - 270
          - 220
          - 124
        input: 完整 ReplySet、任务 ID 与 usage
        output: 一组可呈现的建议＋账本结果
        rules:
          - 结构错误和失败不冒充成功。
          - 重试原任务复用结果与用量。
        prompts: []
        documents: []
      - id: a_suggestions
        domain: app
        title: 08 · 展开建议并填入
        summary: 更多走新请求；返回读本次缓存。
        rect:
          - 30
          - 460
          - 220
          - 124
        input: 与原编辑器仍匹配的三条建议
        output: 用户选中的可编辑草稿、本地历史
        rules:
          - 只填入，不自动发送。
          - 更多的新成功结果再扣 1 次。
          - 保留用户已有编辑。
        prompts: []
        documents:
          - interaction
      - id: advisor_history
        domain: app
        title: 本地历史与修改
        summary: 保存文字和来源，按新增事件组批。
        rect:
          - 30
          - 740
          - 188
          - 124
        input: 最终转写 / OCR、建议与可信修改
        output: 有界增量批次＋相关旧记忆
        rules:
          - 不保存截图；选中不等于发送。
          - 约每 5 小时检查；无新增不调用。
        prompts: []
        documents:
          - memory-and-sync
      - id: advisor_learn
        domain: cloud
        title: 学习提示词
        summary: 限定人物、来源与输出结构。
        rect:
          - 258
          - 740
          - 188
          - 124
        input: 增量批次、来源许可集、baseRevision
        output: 带任务 / 提示词版本的学习请求
        rules:
          - 预算、身份与来源由代码检查。
        prompts:
          - learn
        documents:
          - memory-and-sync
      - id: advisor_model
        domain: provider
        title: 文字模型抽取
        summary: 返回热词、文风和人物候选。
        rect:
          - 486
          - 740
          - 188
          - 124
        input: Cloud 组装的学习提示词＋材料
        output: 结构化 proposals；引用 sourceIds
        rules:
          - 候选不是已经生效的本地记忆。
        prompts: []
        documents: []
      - id: advisor_patch
        domain: cloud
        title: 校验并回传
        summary: 检查结构和来源，不覆盖设备。
        rect:
          - 714
          - 740
          - 188
          - 124
        input: 供应商候选与原任务版本
        output: MemoryPatch＋证据和版本
        rules:
          - 不接受伪造证据、任意文件操作。
          - 按任务去重，记供应商成本。
        prompts: []
        documents: []
      - id: advisor_apply
