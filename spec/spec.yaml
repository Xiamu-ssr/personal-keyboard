            body: 约每 5 小时检查，来源 ID 与记忆版本
            kind: learning
          - from: cloud.learn
            to: app.learning
            title: 结构化候选
            body: 热词 / 文风 / 人物；校验来源后本机确认
            kind: learning
          - from: app.sync
            to: cloud.storage
            title: 加密同步包
            body: 付费可开；资料 UUID、修订与删除记录
            kind: optional
          - from: cloud.storage
            to: app.sync
            title: 云端版本
            body: 先合并后上传，不直接覆盖目录
            kind: optional
      - id: cloud-provider
        a: cloud
        b: provider
        stack:
          - 1165
          - 845
          - 205
          - 230
        paths:
          ab:
            - - 1100
              - 720
            - - 1080
              - 840
            - - 1100
              - 970
          ba:
            - - 1230
              - 970
            - - 1250
              - 840
            - - 1230
              - 720
        packets:
          - from: cloud.identity
            to: provider.sms
            title: 短信验证码请求
            body: 仅企业资质配置完成后发送
            kind: main
          - from: provider.sms
            to: cloud.identity
            title: 发送结果
            body: 失败不伪装为已发送
            kind: main
          - from: cloud.asr
            to: provider.asr
            title: 同一语音任务
            body: 音频流 + 热词 + 近期文字
            kind: main
          - from: provider.asr
            to: cloud.asr
            title: 实时 ASR 结果
            body: 句子修订、最终文本与供应商 usage
            kind: main
          - from: cloud.rewrite
            to: provider.text
            title: 改写提示词 + 转写
            body: 个人整理开关开启才调用
            kind: optional
          - from: provider.text
            to: cloud.rewrite
            title: 个性化文字
            body: 不改变人物、数字、否定与承诺
            kind: optional
          - from: cloud.learn
            to: provider.text
            title: 学习提示词 + 增量证据
            body: 有预算的批次，不上传整段历史
            kind: learning
          - from: provider.text
            to: cloud.learn
            title: 候选与来源引用
            body: 模型不能直接写本机数据库
            kind: learning
