        status:
          phone.chat: 选中稿可继续修改
        after:
          - advisor-5
      - id: advisor-7
        channel: phone-app
        direction: ab
        title: 本人的修改稿
        body: 本人编辑后更新同条军师历史的结果稿，进入记忆更新队列。
        delay: 1700
        fields:
          保留: 截图、聊天内容、填入稿、结果稿
          用途: 近期上下文与个性化学习；不存逐键快照
        status:
          app.history: 历史修订已入队
          app.cache: 等待记忆更新
        after:
          - advisor-6
  - id: learning
    name: 记忆更新
    summary: 完整个人记忆＋分批历史；文本模型提修改，Cloud 校验并提交。
    events:
      - id: learning-1
        channel: app-cloud
        direction: ab
        title: 历史增量
        body: 键盘空闲合批提交新增或改过的历史；不上传全库。
        delay: 1700
        fields:
          来源: 历史 ID＋修订＋本批必要文字
          内容: 识别原文、填入基线、本人结果；帮我回含同一次图文推理返回的聊天摘录。
          范围: 人物 / 会话引用；截图原件继续留手机
          触发: 新增或修订后等待45秒合批；键盘/首页使用时同步，后台每15分钟交由系统调度，非准点闹钟。
        status:
          app.history: 新增与修改已入队
          cloud.proxy: 接收增量任务
        after: []
      - id: learning-2
        channel: app-cloud
        direction: ba
        title: 任务已接收
        body: Cloud 负责后续执行，手机不必常驻。
        delay: 1700
        fields:
          回执: 任务 ID＋已接收的历史修订
          断线: 持久队列重试；同一修订不重复学习
        status:
          cloud.proxy: 读取完整记忆主本
          app.history: 任务已接收
        after:
          - learning-1
      - id: learning-3
        channel: cloud-provider
        direction: ab
        title: 更新提示词＋完整记忆
        body: 每批都带全部热词、场景文风与人物资料；只对历史分批。
        delay: 1700
        prompt: learn
        fields:
          目标: 文本模型
          历史: 本批历史与修订；超长仅拆历史，不拆旧记忆
          记忆: 全部热词、全部场景文风、全部人物事实与关系；含来源、冲突、手动保护。
          版本: baseVersion 等于本次完整主本的 memoryVersion
          容量: 完整请求计 token 并预留输出；记忆本身超限则暂停保留待办，不截断、不筛选
        status:
          cloud.hotwords: 全部词条
          cloud.style: 全部场景
          cloud.people: 全部人物事实与关系
          cloud.proxy: 完整请求计 token
          provider.language: 提出增删改建议
        after:
          - learning-2
      - id: learning-4
        channel: cloud-provider
        direction: ba
        title: 结构化修改建议
        body: 模型返回操作与来源，不能直接写数据库。
        delay: 1700
        fields:
          新增: 热词“豆豆”；来源为本人的明确纠词
          修改粒度: 热词按词条、文风按场景档案；人物身份、事实、关系分别操作
          待确认: 仅人工保护/已有事实冲突；可靠新文风和新资料自动生效。
          操作范围: 已有 ID＋来源修订；新增使用临时 ID，Cloud 分配正式 ID
          版本: 回传 baseVersion；不输出替换整份记忆的全量结果
        status:
          provider.language: 返回操作与证据
          cloud.proxy: 校验归属、来源、版本
        after:
          - learning-3
      - id: learning-5
        channel: app-cloud
        direction: ba
        title: 个人记忆变更
        body: Cloud 事务写库后，下发完整变更记录和删除标记。
        delay: 1700
        fields:
          校验: 来源、归属、保护标记与 baseVersion；冲突则用最新完整主本重算
          主本: Cloud 原子提交；可靠新资料自动生效，真实冲突显示在对应资料旁核对。
          游标: 本批提交成功才推进；下一批携带更新后的完整主本
          下发: 完整变更记录＋删除标记＋版本游标
          本机: 更新缓存；保留原始历史
        status:
          cloud.proxy: 校验通过后提交主本
          cloud.hotwords: 豆豆 · 已加入，可撤销
          cloud.people: 公司变化待确认
          cloud.style: 可靠更新已生效
          app.cache: 同步个人记忆版本
          app.history: 原始历史仍在手机
        after:
          - learning-4
  - id: translation
    name: 翻译
    summary: 原文和译文留在工具里，本人选择后填入。
    events:
      - id: translation-1
        channel: phone-app
        direction: ab
        title: 原文与语言
        body: 选择当前输入、录音稿，或在翻译页编辑原文。
        delay: 1700
        status:
          app.translation: 原文就绪
        after: []
      - id: translation-2
        channel: app-cloud
        direction: ab
        title: 本次翻译
        body: 只上传本次原文和语言，不附人物、热词或文风。
        delay: 1700
        fields:
          原文: 明天上午十点见。
          来源语言: 自动识别
          目标语言: 英语
        status:
          cloud.accounts: 预留Credit
        after:
          - translation-1
      - id: translation-3
        channel: cloud-provider
        direction: ab
        title: 翻译提示词＋原文
        body: 保留原意与语气，译成目标语言。
        delay: 1700
        prompt: translation
        fields:
          目标: Qwen3.8-Flash
          原文: 明天上午十点见。
          来源: auto
          目标语言: en
        status:
          provider.language: 忠实翻译
        after:
          - translation-2
      - id: translation-4
        channel: cloud-provider
        direction: ba
        title: 译文＋实际用量
        body: 完整译文及识别的来源语言。
        delay: 1700
        fields:
          译文: See you at ten tomorrow morning.
          来源语言: zh
        status:
          cloud.accounts: 成功按实际用量扣Credit
        after:
          - translation-3
      - id: translation-5
        channel: app-cloud
        direction: ba
        title: 译文回到工具
        body: 保留原文和译文，不自动修改聊天框。
        delay: 1700
        status:
          app.translation: 可复制或填入
        after:
          - translation-4
      - id: translation-6
        channel: phone-app
        direction: ab
        title: 本人选择填入
        body: 点填入才把当前译文交给输入框。
        delay: 1700
        after:
          - translation-5
      - id: translation-7
        channel: phone-app
        direction: ba
        title: 填入译文
        body: 填入当前输入位置，由本人发送。
        delay: 1700
        status:
          phone.chat: See you at ten tomorrow morning.
        after:
          - translation-6
