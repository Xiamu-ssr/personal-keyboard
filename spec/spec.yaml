businesses:
  - id: voice
    name: 语音转录
    summary: 示例开启个人改写；近期上下文读取本人结果稿。
    events:
      - id: voice-1
        channel: phone-app
        direction: ab
        title: 本人录音
        body: 麦克风音频进入 App。
        delay: 1700
        status:
          phone.microphone: 正在录音
        after: []
      - id: voice-2
        channel: app-cloud
        direction: ab
        title: 音频＋近期上下文
        body: App 上传本次音频和相关本机前文。
        delay: 1700
        fields:
          音频: 实时分块
          近期上下文: 同会话结果稿
        startStreams:
          - phone-app:ab
          - app-cloud:ab
        status:
          app.history: 选择近期上下文
          cloud.accounts: 检查转写额度
        after:
          - voice-1
      - id: voice-3
        channel: cloud-provider
        direction: ab
        title: 实时 ASR 请求
        body: Cloud 取热词，随音频与近期上下文发给语音模型。
        delay: 1700
        fields:
          目标: 语音模型 · Qwen Message
          材料: 音频＋Cloud 热词＋近期上下文
        startStreams:
          - cloud-provider:ab
        status:
          cloud.proxy: 组装语音请求
          cloud.hotwords: 取相关热词
          provider.audio: 实时识别
        after:
          - voice-2
      - id: voice-4
        channel: cloud-provider
        direction: ba
        title: 中间文字
        body: “明天聊豆……”；尚未定稿。
        delay: 1700
        after:
          - voice-3
      - id: voice-5
        channel: app-cloud
        direction: ba
        title: 实时文字
        body: Cloud 将中间文字回传 App。
        delay: 1700
        after:
          - voice-4
      - id: voice-6
        channel: phone-app
        direction: ba
        title: 输入框中的文字
        body: 实时显示，本人可停止或取消。
        delay: 1700
        status:
          phone.chat: 明天聊豆……
        after:
          - voice-5
      - id: voice-7
        channel: cloud-provider
        direction: ba
        title: 最终转写
        body: “明天聊豆包输入法。”＋本次用量。
        delay: 1700
        stopStreams:
          - phone-app:ab
          - app-cloud:ab
          - cloud-provider:ab
        status:
          phone.microphone: 录音结束
          provider.audio: 转写完成
        after:
          - voice-6
      - id: voice-8
        channel: cloud-provider
        direction: ab
        title: 个人改写提示词
        body: 本例开启个人改写；Cloud 取场景文风，调用文本模型。
        delay: 1700
        prompt: rewrite
        fields:
          目标: 文本模型
          材料: ASR 原文＋场景文风＋热词＋近期上下文
        status:
          cloud.style: 取适用场景
          provider.language: 整理文字
        after:
          - voice-7
      - id: voice-9
        channel: cloud-provider
        direction: ba
        title: 整理后的文字
        body: “明天再聊豆包输入法。”；与 ASR 原文分开保留。
        delay: 1700
        after:
          - voice-8
      - id: voice-10
        channel: app-cloud
        direction: ba
        title: 原文＋填入稿
        body: App 保存本条历史；Cloud 只按成功最终 ASR 文字结算。
        delay: 1700
        fields:
          ASR原文: 明天聊豆包输入法。
          实际填入稿: 明天再聊豆包输入法。
        status:
          app.history: 保留原文与填入稿
          cloud.accounts: 成功字符结算
          cloud.proxy: 请求完成
        after:
          - voice-9
      - id: voice-11
        channel: phone-app
        direction: ba
        title: 实际填入稿
        body: App 填入输入框；结果稿初始化为同一文字，用户不改就保留该值。
        delay: 1700
        fields:
          实际填入稿: 明天再聊豆包输入法。
          结果稿: 明天再聊豆包输入法。
        status:
          phone.chat: 明天再聊豆包输入法。
        after:
          - voice-10
      - id: voice-12
        channel: phone-app
        direction: ab
        title: 本人的修改稿
        body: “豆包”改为“豆豆”；更新同条历史，进入记忆更新队列。
        delay: 1700
        fields:
          结果稿: 明天再聊豆豆输入法。
          纠词证据: 比较实际填入稿，排除模型添加的“再”
        status:
          phone.chat: 明天再聊豆豆输入法。
          app.history: 历史修订已入队
          app.cache: 等待记忆更新
        after:
          - voice-11
  - id: advisor
    name: 军师模式
    summary: 截图与近期上下文来自 App；人物与文风由 Cloud 读取。
    events:
      - id: advisor-1
        channel: phone-app
        direction: ab
        title: 本次聊天截图
        body: 键盘缩矮后截屏，保存到本机军师历史。
        delay: 1700
        status:
          phone.chat: 当前聊天画面
          app.history: 本次截图
        after: []
      - id: advisor-2
        channel: app-cloud
        direction: ab
        title: 截图＋近期上下文
        body: App 只提交本机任务材料与会话标识。
        delay: 1700
        fields:
          截图: 本次聊天画面
          会话标识: 关联对象引用；未知则不强行认人
          近期上下文: 同会话结果稿
          意图: 本次表达目标
        status:
          app.history: 选取同会话近期上下文
          cloud.accounts: 检查军师额度
        after:
          - advisor-1
      - id: advisor-3
        channel: cloud-provider
        direction: ab
        title: 军师提示词＋图文
        body: Cloud 读取相关人物和文风，随本次材料发给多模态模型。
        delay: 1700
        prompt: reply
        fields:
          目标: 多模态模型
          来自App: 截图＋近期上下文＋意图
          来自Cloud: 相关人物资料＋场景文风
        status:
          cloud.people: 读取相关人物
          cloud.style: 读取适用文风
          cloud.proxy: 组装一次多模态请求
          provider.language: 读图并给出建议
        after:
          - advisor-2
      - id: advisor-4
        channel: cloud-provider
        direction: ba
        title: 建议＋聊天内容
        body: 三种表达各一条，同时返回可见消息与说话人。
        delay: 1700
        fields:
          建议: 三种风格各一条
          聊天内容: 说话人、消息、截图位置；不清楚则标未知
        after:
          - advisor-3
      - id: advisor-5
        channel: app-cloud
        direction: ba
        title: 军师结果
        body: App 将截图、聊天内容与建议关联；成功生成扣一次。
        delay: 1700
        status:
          app.history: 保存军师结果
          cloud.accounts: 成功生成扣 1 次
          cloud.proxy: 请求完成
        after:
          - advisor-4
      - id: advisor-6
        channel: phone-app
        direction: ba
        title: 选中的回复
        body: 键盘恢复高度，用户选择后填入；该回复同时成为填入稿与初始结果稿。
        delay: 1700
        status:
          phone.chat: 选中稿可继续修改
        after:
          - advisor-5
      - id: advisor-7
        channel: phone-app
        direction: ab
        title: 本人的修改稿
        body: 本人编辑后更新同条军师历史的结果稿，进入记忆更新队列。
        delay: 1700
        fields:
          保留: 截图、聊天内容、填入稿、结果稿
          用途: 近期上下文与个性化学习；不存逐键快照
        status:
          app.history: 历史修订已入队
          app.cache: 等待记忆更新
        after:
          - advisor-6
  - id: learning
    name: 记忆更新
    summary: 完整个人记忆＋分批历史；文本模型提修改，Cloud 校验并提交。
    events:
      - id: learning-1
        channel: app-cloud
        direction: ab
        title: 历史增量
        body: 键盘空闲合批提交新增或改过的历史；不上传全库。
        delay: 1700
        fields:
          来源: 历史 ID＋修订＋本批必要文字
          内容: 原文、填入稿、结果稿；军师含有归属的聊天内容
          范围: 人物 / 会话引用；截图原件继续留手机
        status:
          app.history: 新增与修改已入队
          cloud.proxy: 接收增量任务
        after: []
      - id: learning-2
        channel: app-cloud
        direction: ba
        title: 任务已接收
        body: Cloud 负责后续执行，手机不必常驻。
        delay: 1700
        fields:
          回执: 任务 ID＋已接收的历史修订
          断线: 持久队列重试；同一修订不重复学习
        status:
          cloud.proxy: 读取完整记忆主本
          app.history: 任务已接收
        after:
          - learning-1
      - id: learning-3
        channel: cloud-provider
        direction: ab
        title: 更新提示词＋完整记忆
        body: 每批都带全部热词、场景文风与人物资料；只对历史分批。
        delay: 1700
        prompt: learn
        fields:
          目标: 文本模型
          历史: 本批历史与修订；超长仅拆历史，不拆旧记忆
          记忆: 全部热词、全部场景文风、全部人物事实与关系；含来源、待确认项、手动保护
          版本: baseVersion 等于本次完整主本的 memoryVersion
          容量: 完整请求计 token 并预留输出；记忆本身超限则暂停保留待办，不截断、不筛选
        status:
          cloud.hotwords: 全部词条
          cloud.style: 全部场景
          cloud.people: 全部人物事实与关系
          cloud.proxy: 完整请求计 token
          provider.language: 提出增删改建议
        after:
          - learning-2
      - id: learning-4
        channel: cloud-provider
        direction: ba
        title: 结构化修改建议
        body: 模型返回操作与来源，不能直接写数据库。
        delay: 1700
        fields:
          新增: 热词“豆豆”；来源为本人的明确纠词
          修改粒度: 热词按词条、文风按场景档案；人物身份、事实、关系分别操作
          待确认: 文风变化；人物 P1 公司事实 F1 与新证据冲突
          操作范围: 已有 ID＋来源修订；新增使用临时 ID，Cloud 分配正式 ID
          版本: 回传 baseVersion；不输出替换整份记忆的全量结果
        status:
          provider.language: 返回操作与证据
          cloud.proxy: 校验归属、来源、版本
        after:
          - learning-3
      - id: learning-5
        channel: app-cloud
        direction: ba
        title: 个人记忆变更
        body: Cloud 事务写库后，下发完整变更记录和删除标记。
        delay: 1700
        fields:
          校验: 来源、归属、保护标记与 baseVersion；冲突则用最新完整主本重算
          主本: Cloud 原子提交；公司冲突暂存候选，其他资料保持
          游标: 本批提交成功才推进；下一批携带更新后的完整主本
          下发: 完整变更记录＋删除标记＋版本游标
          本机: 更新缓存；保留原始历史
        status:
          cloud.proxy: 校验通过后提交主本
          cloud.hotwords: 豆豆 · 已加入，可撤销
          cloud.people: 公司变化待确认
          cloud.style: 变化先确认
          app.cache: 同步个人记忆版本
          app.history: 原始历史仍在手机
        after:
          - learning-4
