      - id: quota
        edge: reserve
        title: 先预留本次权益
        body: 为本次语音预留字符预算。
        delay: 450
        phase: input
        after:
          - first-upload
        status:
          cloud.quota: 鉴权、预留
      - id: quota-ok
        edge: grant
        title: 权益允许调用
        body: 同一任务标识使重试不会重复扣量。
        delay: 400
        phase: input
        after:
          - quota
        status:
          cloud.quota: 已预留，尚未结算
      - id: request-model
        edge: model
        title: 供应商持续接收音频
        body: 同一条实时连接，避免每句话重建会话。
        delay: 1400
        phase: input
        after:
          - quota-ok
        status:
          provider.asr: 实时识别
        startStreams:
          - model
      - id: partial-provider
        edge: model-result
        title: 中间结果：“今晚跟豆…”
        body: partial 可修订，尚未计入最终字符。
        delay: 450
        phase: input
        after:
          - request-model
        status:
          cloud.asr: 收到中间字
      - id: partial-app
        edge: result
        title: 中间文字回到 App
        body: 显示实时文字，原记录还未封为 ASR final。
        delay: 700
        phase: input
        after:
          - partial-provider
        status:
          app.writer: 今晚跟豆…
      - id: next-audio
        edge: upload
        title: 后续音频继续流动
        body: 去程仍在发送，回程已经开始出字。
        delay: 300
        phase: input
        after:
          - partial-app
      - id: next-model
        edge: model
        title: 同一会话的后续音频
        body: 后续分块进入现有供应商会话。
        delay: 300
        phase: input
        after:
          - next-audio
      - id: final-model
        edge: model-result
        title: 最终转写：“今晚跟豆包聊 CPA。”
        body: ASR 把专有名词识别成了豆包；原文需要保留。
        delay: 900
        phase: input
        after:
          - next-model
        status:
          provider.asr: 本次结果已返回
          phone.microphone: 录音结束
          app.capture: 音频已提交
          cloud.asr: 最终转写已返回
        stopStreams:
          - capture
          - upload
          - model
      - id: settle
        edge: reserve
        title: 成功结果才结算
        body: final 文本只结算一次；中间字不重复累计。
        delay: 450
        phase: input
        after:
          - final-model
        status:
          cloud.quota: 成功结算一次
      - id: final-app
        edge: result
        title: 原始转写回到 App
        body: rawAsrText = 今晚跟豆包聊 CPA。
        delay: 900
        phase: input
        after:
          - settle
        status:
          app.writer: rawAsrText 已保留
          cloud.asr: 结果已校验并回传
        facts:
          rawAsrText: 今晚跟豆包聊 CPA。
          contextEvidence: null
      - id: save-source
        edge: record
        title: 先保存本次历史
        body: R-104 已保存原始转写，尚未把它当作已发送。
        delay: 650
        phase: history
        after:
          - final-app
        status:
          app.history: R-104 · 原记录已保存
      - id: insert-text
        edge: insert
        title: 用户选择填入
        body: insertedText = 今晚跟豆包聊 CPA。
        delay: 1200
        phase: history
        after:
          - save-source
        status:
          phone.editor: 今晚跟豆包聊 CPA。
        facts:
          insertedText: 今晚跟豆包聊 CPA。
      - id: edit-observed
        edge: observe
        title: 用户把“豆包”改成“豆豆”
        body: 记录同一上屏范围的稳定非空快照，不等用户发送。
        delay: 1400
        phase: history
        after:
          - insert-text
        status:
          phone.editor: 今晚跟豆豆聊 CPA。
          app.observer: 同一输入范围的稳定改稿
        facts:
          lastObservedText: 今晚跟豆豆聊 CPA。
      - id: compare
        edge: snapshot
        title: 本机对齐前后文本
        body: 对齐结果只标出“豆包 → 豆豆”，其余文字保持。
        delay: 1000
        phase: history
        after:
          - edit-observed
        status:
          app.difference: 豆包 → 豆豆
      - id: save-edit
        edge: difference
        title: 差异单独存证
        body: E-208 关联 R-104，保留 before / after、差异位置、范围与来源修订。
        delay: 1100
        phase: history
        after:
          - compare
        status:
          app.history: R-104 + E-208 · 原文未覆盖
        facts:
          evidenceIds:
            - E-208
          finality: observed_draft
      - id: editor-cleared
        edge: null
        title: 聊天 App 清空了输入框
        body: 保留最后看到的非空版本；只能标记发送状态未知，不把空文本学成删除。
        delay: 1400
        phase: history
        after:
          - save-edit
        node: phone.editor
        status:
          phone.editor: 输入框已清空 · 发送状态未知
          app.history: 最后观察值保留，等待整理
        facts:
          finality: unknown_after_clear
      - id: five-hours
        edge: null
        title: 模拟时钟推进五小时
        body: 输入已经结束，后台增量任务仍会继续；没有新增则不调用模型。
        delay: 1000
        phase: learning
        after:
          - editor-cleared
        node: app.batch
        status:
          app.batch: 5h 检查点 · 有新增
        facts:
          clock: 5h later
      - id: new-history
        edge: increment
        title: 取水位之后的增量
        body: 按来源切片；没有把五小时原文全塞进一个上下文。
        delay: 700
        phase: learning
        after:
          - five-hours
        status:
          app.batch: 增量 2 条，保留源 ID 和断点
      - id: old-memory
        edge: relevant
        title: 带上相关旧记忆版本
        body: 只带本批涉及的词条 / 人物；手动记忆不可被覆盖。
        delay: 650
        phase: learning
        after:
          - new-history
      - id: learning-job
        edge: batch
        title: 提交一个可重试的整理任务
        body: batchId + source spans + baseRevision；这不是整库云备份，免费本地用户也走此分析路径。
        delay: 950
        phase: learning
        after:
          - old-memory
        status:
          cloud.learn: 固定工作流 · 分批提取
      - id: learning-prompt
        edge: learn
        title: 学习提示词与证据发给文字模型
        body: 区分专有词纠正与改意图，只有用户自己的编辑可作为纠词证据。
        delay: 1300
        phase: learning
        after:
          - learning-job
        status:
          provider.text: 按本批证据分类与提取
      - id: learning-candidates
        edge: proposals
        title: 返回结构化候选
        body: 候选：将“豆豆”加入热词；来源 E-208，不做“豆包→豆豆”的全局替换。
        delay: 1000
        phase: learning
        after:
          - learning-prompt
        status:
          cloud.learn: 校验来源、作用域、冲突与版本
          provider.text: 结构化候选已返回
      - id: memory-patch
        edge: patch
        title: 程序校验后应用记忆补丁
        body: 无冲突的明确专有词可成为可撤销 ASR 偏置；原 R-104 与 E-208 保留。
        delay: 1400
        phase: learning
        after:
          - learning-candidates
        status:
          app.memory: 记忆 v18 · 热词新增“豆豆”
          app.batch: 本批已确认，推进处理断点
          app.history: 已整理，原文与证据保留
          cloud.learn: 校验完成，补丁已返回
        facts:
          memoryRevision: 18
          processed:
            - E-208
          word: 豆豆
          historyRetained: true
      - id: reuse-memory
        edge: context
        title: 下一次输入取更新后的记忆
        body: “豆豆”进入 ASR 热词上下文，帮助识别；不会强制替换用户真的说的豆包。
        delay: 1500
        phase: reuse
        after:
          - memory-patch
        status:
          app.capture: 下次上下文已含“豆豆”
        facts:
          reusedRevision: 18
