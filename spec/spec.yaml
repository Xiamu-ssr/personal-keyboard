schemaVersion: 3
meta:
  title: 豆豆输入法
  subtitle: 产品与商业服务规格
  version: 0.4.0-alpha.1
  reviewedAt: 2026-10-21
  status: App / Cloud 实现；短信与模型供应商配置待完成
domains:
  - id: phone
    name: 用户手机
    icon: phone
    color: "#557fc3"
    summary: 麦克风、当前聊天与系统权限。
    responsibilities:
      - 提供录音与当前可见聊天；普通打字不自动读屏。
      - 截屏完成即本地 OCR，处理后释放图片。
      - 用户决定填入和发送，模型不能点击发送。
    data:
      - 临时音频 / 截屏
      - 当前输入框与选区
    code:
      - app/
    documents:
      - interaction
  - id: app
    name: 输入法 App
    icon: keyboard
    color: "#268976"
    summary: 键盘、语音、军师和本地记忆。
    responsibilities:
      - 本地保存文字历史、热词、文风与人物资料。
      - 只给 Cloud 当前任务所需资料；不持有供应商密钥。
      - 免费账户只在本地保存；付费可开启产品云同步。
    data:
      - 转写 / OCR 历史
      - 热词、文风、人物与证据
      - 产品登录凭证
    code:
      - app/
    documents:
      - product
      - memory-and-sync
      - implementation
  - id: cloud
    name: Cloud 服务
    icon: cloud
    color: "#8b6bc2"
    summary: 账号、权益、模型代理与云同步。
    responsibilities:
      - 国内先用手机号验证码；海外登录后续接入。
      - 按任务预留权益；代理 ASR / LLM，成功结算，失败释放。
      - 组装版本化提示词；管理付费私有同步与后台任务。
    data:
      - 用户与登录身份
      - 套餐快照、权益、用量与订单
      - 提示词 / 路由版本
      - 付费用户的加密同步包
    code:
      - cloud/identity/
      - cloud/billing/
      - cloud/jobs/
      - cloud/sync/
      - cloud/prompts/
    documents:
      - architecture
      - commercial
      - memory-and-sync
  - id: provider
    name: 供应商
    icon: spark
    color: "#c48b43"
    summary: Qwen ASR、文字模型及基础服务。
    responsibilities:
      - 默认 ASR：Qwen Audio 3.1 Message。
      - 提供文字 / 图文模型和短信；支付尚未接入。
      - 服务凭据只由 Cloud 使用；商用不依赖个人订阅额度。
    data:
      - 必要音频或文字
      - 供应商用量与回执
    code:
      - cloud/models/
      - cloud/identity/sms.mjs
    documents:
      - models-and-cost
      - commercial
  - id: admin
    name: 运营后台
    icon: admin
    color: "#bd718b"
    summary: 查用户、管权益、看用量与故障。
    responsibilities:
      - 用户 / 权益、订单 / 用量、供应商 / 故障分别查看。
      - 套餐先存草稿再发布；提示词随代码发布，变更保留审计。
      - 显示脱敏账号与成本元数据，不默认开放私人聊天内容。
    data:
      - 脱敏用户状态
      - 权益账本和供应商成本
      - 配置变更与操作审计
    code:
      - cloud/admin/
      - cloud/operator/
    documents:
      - commercial
      - architecture
prompts:
  - id: rewrite
    owner: cloud
    name: 个人改写提示词
    source: cloud/prompts/rewrite.md
    document: rewrite-prompt
  - id: reply
    owner: cloud
    name: 军师提示词
    source: cloud/prompts/reply.md
    document: reply-prompt
  - id: learn
    owner: cloud
    name: 记忆学习提示词
    source: cloud/prompts/learn.md
    document: learn-prompt
