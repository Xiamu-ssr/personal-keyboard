        channel: app-cloud
        entryVia:
          - - 790
            - 350
          - - 790
            - 210
          - - 558
            - 210
          - - 558
            - 285
      - id: record
        from: app.writer.record
        to: app.history.record
        title: 保存本次记录
        detail: 同一个 recordId：rawAsrText、insertedText、lastObservedText；军师另存 contextEvidence 和 suggestions。
      - id: insert
        from: app.writer.text
        to: phone.editor.text
        title: 本人选择后填入
