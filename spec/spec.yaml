schemaVersion: 2
meta:
  title: 豆豆输入法
  subtitle: 产品与商业服务规格
  version: 0.3.0-alpha.1
  reviewedAt: 2026-10-21
  status: 商业服务目标规格；当前 APK 仍为原生预览版
domains:
  - id: phone
    name: 用户手机
    icon: phone
    color: "#557fc3"
    summary: 麦克风、当前聊天与系统权限。
    responsibilities:
      - 提供录音与当前可见聊天；普通打字不自动读屏。
      - 截屏完成即本地 OCR，处理后释放图片。
      - 用户决定填入和发送，模型不能点击发送。
    data:
      - 临时音频 / 截屏
      - 当前输入框与选区
    code:
      - app/
    documents:
      - interaction
  - id: app
    name: 输入法 App
    icon: keyboard
    color: "#268976"
    summary: 键盘、语音、军师和本地记忆。
    responsibilities:
      - 本地保存文字历史、热词、文风与人物资料。
      - 只给 Cloud 当前任务所需资料；不持有供应商密钥。
      - 免费账户只在本地保存；付费可开启产品云同步。
    data:
      - 转写 / OCR 历史
      - 热词、文风、人物与证据
      - 产品登录凭证
    code:
      - app/
    documents:
      - product
      - memory-and-sync
      - implementation
  - id: cloud
    name: Cloud 服务
    icon: cloud
    color: "#8b6bc2"
    summary: 账号、权益、模型代理与云同步。
    responsibilities:
      - 国内手机号验证码、海外 Google 登录，映射同一产品账号。
      - 按任务预留权益；代理 ASR / LLM，成功结算，失败释放。
      - 组装版本化提示词；管理付费私有同步与后台任务。
    data:
      - 用户与登录身份
      - 套餐快照、权益、用量与订单
      - 提示词 / 路由版本
      - 付费用户的加密同步包
    code:
      - cloud/domains/
      - cloud/contracts/
      - cloud/config/
      - cloud/prompts/
    documents:
      - architecture
      - commercial
      - memory-and-sync
  - id: provider
    name: 供应商
    icon: spark
    color: "#c48b43"
    summary: Qwen ASR、文字模型及基础服务。
    responsibilities:
      - 默认 ASR：Qwen Audio 3.1 Message。
      - 文字模型、短信、支付与对象存储分别适配。
      - 服务凭据只由 Cloud 使用；商用不依赖个人订阅额度。
    data:
      - 必要音频或文字
      - 供应商用量与回执
    code:
      - cloud/config/providers.json
    documents:
      - models-and-cost
      - commercial
  - id: admin
    name: 运营后台
    icon: admin
    color: "#bd718b"
    summary: 查用户、管权益、看用量与故障。
    responsibilities:
      - 用户 / 权益、订单 / 用量、供应商 / 故障分别查看。
      - 套餐与提示词先存草稿，再发布新版本；保留审计和回滚。
      - 显示脱敏账号与成本元数据，不默认开放私人聊天内容。
    data:
      - 脱敏用户状态
      - 权益账本和供应商成本
      - 配置变更与操作审计
    code:
      - cloud/（目标后台模块）
    documents:
      - commercial
      - architecture
prompts:
  - id: rewrite
    owner: cloud
    name: 个人改写提示词
    source: cloud/prompts/rewrite.md
    document: rewrite-prompt
  - id: reply
    owner: cloud
    name: 军师提示词
    source: cloud/prompts/reply.md
    document: reply-prompt
  - id: learn
    owner: cloud
    name: 记忆学习提示词
    source: cloud/prompts/learn.md
    document: learn-prompt
workflows:
  - id: voice
    name: 语音转录
    summary: 实时转写；个人改写可选，文字历史与记忆留在本机。
    width: 1160
    height: 910
    nodes:
      - id: v_record
        domain: phone
        title: 01 · 说话
        summary: 麦克风录音，不长期保存原音频。
        rect:
          - 30
          - 80
          - 220
          - 124
        input: 用户主动开始录音
        output: 短时单声道音频流
        rules: []
        prompts: []
        documents: []
      - id: v_context
        domain: app
        title: 02 · 取近期上下文
        summary: 结合热词；个人改写有独立开关。
        rect:
          - 310
          - 80
          - 220
          - 124
        input: 录音、当前范围的近期文字与热词
        output: 产品会话、音频与最少识别上下文
        rules:
          - 近期上下文辅助听懂，不代替文风。
          - 录音与输出时长由 Cloud 限制。
        prompts: []
        documents: []
      - id: v_gate
        domain: cloud
        title: 03 · 校验与代理
        summary: 鉴权、预留字符预算、连接 ASR。
        rect:
          - 590
          - 80
          - 220
          - 124
        input: 产品登录会话、任务 ID、字符上限
        output: 同一任务的供应商 ASR 流
        rules:
          - 预留和结算属于同一账本任务。
          - 无额度不调用供应商；不把密钥给 App。
        prompts: []
        documents:
          - commercial
      - id: v_asr
        domain: provider
        title: 04 · Qwen Message
        summary: 实时中间字、句末文字与基础规整。
        rect:
          - 870
          - 80
          - 220
          - 124
        input: Cloud 代理的音频、热词和近期上下文
        output: 中间结果、句末结果与 usage
        rules:
          - 即时热词、上下文、原生润色按接口配置。
        prompts: []
        documents:
          - models-and-cost
      - id: v_final
        domain: cloud
        title: 05 · 回传与结算
        summary: 中间字不累计；成功最终文字计量。
        rect:
          - 590
          - 270
          - 220
          - 124
        input: ASR 最终文本和供应商 usage
        output: 转写结果＋已结算用量
        rules:
          - 最终非空白 Unicode 码点计字符。
          - 失败 / 取消释放未完成预留。
          - 同任务重试恢复原结果，不再扣字符。
        prompts: []
        documents: []
      - id: v_preview
        domain: app
        title: 06 · 转写预览
        summary: 可编辑；决定是否按个人口吻整理。
        rect:
          - 310
          - 270
          - 220
          - 124
        input: 已成功转写的最终文字
        output: 原转写，或追加个人改写请求
        rules:
          - 改写失败仍保留已成功的原转写。
          - 个人整理不重复扣转写字符。
        prompts: []
        documents: []
      - id: v_insert
        domain: app
        title: 08 · 填入与本地保存
        summary: 保留草稿；后续可信修改形成证据。
        rect:
          - 30
          - 460
          - 220
          - 124
        input: 原转写或个性改写文字
        output: 编辑器中的可修改文字与本地历史
        rules:
          - 编辑器切换或取消后，旧结果不能覆盖。
          - 发送由用户操作。
        prompts: []
        documents: []
      - id: v_rewrite
        domain: cloud
        title: 07 · 个人改写提示词
        summary: 最终转写＋适用热词与文风。
        rect:
          - 590
          - 460
          - 220
          - 124
        input: 产品任务 ID、原转写、适用文风
        output: 文字模型请求；改写结果经 Cloud 回传
        rules:
          - 仅开关开启时执行；保留原意。
          - 关联原语音任务和独立成本预算。
        prompts:
          - rewrite
        documents: []
      - id: v_text
        domain: provider
        title: 文字模型改写
        summary: 按 Cloud 提示词输出结构化文字。
        rect:
          - 870
          - 460
          - 220
          - 124
        input: 改写提示词＋任务所需个人资料
        output: text / changed / uncertainSpans
        rules: []
        prompts: []
        documents: []
      - id: voice_history
        domain: app
        title: 本地历史与修改
        summary: 保存文字和来源，按新增事件组批。
        rect:
          - 30
          - 740
          - 188
          - 124
        input: 最终转写 / OCR、建议与可信修改
        output: 有界增量批次＋相关旧记忆
        rules:
          - 不保存截图；选中不等于发送。
          - 约每 5 小时检查；无新增不调用。
        prompts: []
        documents:
          - memory-and-sync
      - id: voice_learn
        domain: cloud
        title: 学习提示词
        summary: 限定人物、来源与输出结构。
        rect:
          - 258
          - 740
          - 188
          - 124
        input: 增量批次、来源许可集、baseRevision
        output: 带任务 / 提示词版本的学习请求
        rules:
          - 预算、身份与来源由代码检查。
        prompts:
          - learn
        documents:
          - memory-and-sync
      - id: voice_model
        domain: provider
        title: 文字模型抽取
        summary: 返回热词、文风和人物候选。
        rect:
          - 486
          - 740
          - 188
          - 124
        input: Cloud 组装的学习提示词＋材料
        output: 结构化 proposals；引用 sourceIds
        rules:
          - 候选不是已经生效的本地记忆。
        prompts: []
        documents: []
      - id: voice_patch
        domain: cloud
        title: 校验并回传
        summary: 检查结构和来源，不覆盖设备。
        rect:
          - 714
          - 740
          - 188
          - 124
        input: 供应商候选与原任务版本
        output: MemoryPatch＋证据和版本
        rules:
          - 不接受伪造证据、任意文件操作。
          - 按任务去重，记供应商成本。
        prompts: []
        documents: []
      - id: voice_apply
        domain: app
        title: 合并本地记忆
        summary: 用户手改和删除优先，供下次用。
        rect:
          - 942
          - 740
          - 188
          - 124
        input: MemoryPatch＋本机最新 revision
        output: 热词 / 文风 / 人物资料的新修订
        rules:
          - 版本冲突不强行覆盖。
          - 事务成功后推进游标；重试不重复强化。
        prompts: []
        documents:
          - memory-and-sync
    edges:
      - id: v1
        from: v_record
        to: v_context
        label: 音频
        kind: main
        points:
          - - 250
            - 142
          - - 310
            - 142
        note: 音频
      - id: v2
