            title: 可选个人整理
            body: 转写 + 热词 + 本人文风
            kind: optional
          - from: cloud.rewrite
            to: app.keyboard
            title: 整理后的表达
            body: 沿用原语音任务，不重复扣字符
            kind: optional
          - from: app.history
            to: cloud.learn
