      - id: quota
        edge: reserve
        title: 先预留本次权益
        body: 为本次成功的一组三条回复预留 1 次。
        delay: 450
        phase: input
        after:
          - first-upload
        status:
          cloud.quota: 鉴权、预留
      - id: quota-ok
        edge: grant
        title: 权益允许调用
        body: 同一任务标识使重试不会重复扣量。
        delay: 400
        phase: input
        after:
          - quota
        status:
          cloud.quota: 已预留，尚未结算
      - id: request-model
        edge: model
        title: 一次多模态推理
        body: 看截图里的气泡、引用和表情，同时理解上下文并生成建议。
        delay: 1400
        phase: input
        after:
          - quota-ok
        status:
          provider.vision: 看图 + 生成回复
      - id: final-model
        edge: model-result
        title: 三条建议与文字上下文同时返回
        body: contextEvidence：林同学说“刚忙完，今天有点累”；另附三条不同风格回复。
        delay: 900
        phase: input
        after:
          - request-model
        status:
          provider.vision: 本次结果已返回
      - id: settle
        edge: reserve
        title: 成功结果才结算
        body: 三条回复结构校验通过，结算 1 次军师。
        delay: 450
        phase: input
        after:
          - final-model
        status:
          cloud.quota: 成功结算一次
      - id: final-app
        edge: result
        title: 三条回复回到 App
        body: 结果就绪后恢复键盘高度，用户选择温和回复。
        delay: 900
        phase: input
        after:
          - settle
        status:
          app.writer: 展示三条回复
          cloud.advisor: 结果已校验并回传
          phone.screen: 本次截图已释放
          app.capture: 本次图片已释放
        facts:
          rawAsrText: null
          contextEvidence: 林同学：刚忙完，今天有点累。
      - id: save-source
        edge: record
        title: 先保存本次历史
        body: R-104 保存文字上下文与建议；释放当次图片，不保存截图。
        delay: 650
        phase: history
        after:
          - final-app
        status:
          app.history: R-104 · 原记录已保存
      - id: insert-text
        edge: insert
        title: 用户选择填入
        body: insertedText = 辛苦啦，先好好休息。
        delay: 1200
        phase: history
        after:
          - save-source
        status:
          phone.editor: 辛苦啦，先好好休息。
        facts:
          insertedText: 辛苦啦，先好好休息。
      - id: edit-observed
        edge: observe
        title: 用户把“辛苦啦”改为“辛苦咯”
        body: 记录同一上屏范围的稳定非空快照，不等用户发送。
        delay: 1400
        phase: history
        after:
          - insert-text
        status:
          phone.editor: 辛苦咯，先好好休息。
          app.observer: 同一输入范围的稳定改稿
        facts:
          lastObservedText: 辛苦咯，先好好休息。
      - id: compare
        edge: snapshot
        title: 本机对齐前后文本
        body: “啦 → 咯”是一条文风证据，单次不足以成为永久规则。
        delay: 1000
        phase: history
        after:
          - edit-observed
        status:
          app.difference: 啦 → 咯
      - id: save-edit
        edge: difference
        title: 差异单独存证
        body: E-208 关联 R-104，保留 before / after、差异位置、范围与来源修订。
        delay: 1100
        phase: history
        after:
          - compare
        status:
          app.history: R-104 + E-208 · 原文未覆盖
        facts:
          evidenceIds:
            - E-208
          finality: observed_draft
      - id: editor-cleared
        edge: null
        title: 聊天 App 清空了输入框
        body: 保留最后看到的非空版本；只能标记发送状态未知，不把空文本学成删除。
        delay: 1400
        phase: history
        after:
          - save-edit
        node: phone.editor
        status:
          phone.editor: 输入框已清空 · 发送状态未知
          app.history: 最后观察值保留，等待整理
        facts:
          finality: unknown_after_clear
      - id: five-hours
        edge: null
        title: 模拟时钟推进五小时
        body: 输入已经结束，后台增量任务仍会继续；没有新增则不调用模型。
        delay: 1000
        phase: learning
        after:
          - editor-cleared
        node: app.batch
        status:
          app.batch: 5h 检查点 · 有新增
        facts:
          clock: 5h later
      - id: new-history
        edge: increment
        title: 取水位之后的增量
        body: 按来源切片；没有把五小时原文全塞进一个上下文。
        delay: 700
        phase: learning
        after:
          - five-hours
        status:
          app.batch: 增量 2 条，保留源 ID 和断点
      - id: old-memory
        edge: relevant
        title: 带上相关旧记忆版本
        body: 只带本批涉及的词条 / 人物；手动记忆不可被覆盖。
        delay: 650
        phase: learning
        after:
          - new-history
      - id: learning-job
        edge: batch
        title: 提交一个可重试的整理任务
        body: batchId + source spans + baseRevision；这不是整库云备份，免费本地用户也走此分析路径。
        delay: 950
        phase: learning
        after:
          - old-memory
        status:
          cloud.learn: 固定工作流 · 分批提取
      - id: learning-prompt
        edge: learn
        title: 学习提示词与证据发给文字模型
        body: 区分本人语气与对方信息；建议不等于事实，没选中不等于不喜欢。
        delay: 1300
        phase: learning
        after:
          - learning-job
        status:
          provider.text: 按本批证据分类与提取
      - id: learning-candidates
        edge: proposals
        title: 返回结构化候选
        body: 候选：一条个人文风证据；林同学“今天有点累”是短期状态，不推断长期人格。
        delay: 1000
        phase: learning
        after:
          - learning-prompt
        status:
          cloud.learn: 校验来源、作用域、冲突与版本
          provider.text: 结构化候选已返回
      - id: memory-patch
        edge: patch
        title: 程序校验后应用记忆补丁
        body: “咯”先累计证据；本人风格要多次一致修改，对方短期状态带有效期。
        delay: 1400
        phase: learning
        after:
          - learning-candidates
        status:
          app.memory: 记忆 v18 · 风格证据 +1
          app.batch: 本批已确认，推进处理断点
          app.history: 已整理，原文与证据保留
          cloud.learn: 校验完成，补丁已返回
        facts:
          memoryRevision: 18
          processed:
            - E-208
          word: null
          historyRetained: true
      - id: reuse-memory
        edge: context
        title: 下一次输入取更新后的记忆
        body: 下一次军师取本人已启用文风与当前人物记忆；未成熟的风格候选不生效。
        delay: 1500
        phase: reuse
        after:
          - memory-patch
        status:
          app.capture: 下次请求取最新相关记忆
        facts:
          reusedRevision: 18
