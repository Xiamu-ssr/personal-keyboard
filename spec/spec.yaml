            prompts: []
          - id: context
            title: 热词与近期文字
            summary: 帮助识别人名、专有词
            documents: []
            prompts: []
          - id: memory
            title: 个人记忆
            summary: 热词、文风、人物与事件
            documents:
              - memory-and-sync
            prompts: []
          - id: history
            title: 文字历史
            summary: 保留来源，不存原始截图
            documents: []
            prompts: []
          - id: learning
            title: 新增历史整理
            summary: 分批提候选，本机确认后合并
            documents: []
            prompts: []
          - id: sync
            title: 云同步
            summary: 付费权益；加密、版本合并
            documents: []
            prompts: []
      - domain: cloud
        rect:
          - 1000
          - 70
          - 330
          - 650
        children:
          - id: identity
            title: 账号与权益
            summary: 验证码登录 · 预留 / 结算 / 释放
            documents:
              - commercial
            prompts: []
          - id: asr
            title: 实时语音代理
            summary: 同一任务维持供应商连接
            documents: []
            prompts: []
          - id: rewrite
            title: 个人改写提示词
            summary: 可选：原意 + 热词 + 文风
            documents: []
            prompts:
              - rewrite
            targets:
              - provider.text
          - id: learn
            title: 记忆学习提示词
            summary: 增量来源 → 结构化候选
            documents: []
            prompts:
              - learn
            targets:
              - provider.text
          - id: storage
            title: 私有同步存储
            summary: 按账号隔离，不供免费历史归档
            documents: []
            prompts: []
      - domain: provider
        rect:
          - 1000
          - 970
          - 330
          - 370
        children:
          - id: asr
            title: Qwen Message
            summary: 实时中间结果、热词与近期上下文
            documents: []
            prompts: []
          - id: text
            title: 文字模型
            summary: Qwen Flash：改写与记忆候选
            documents: []
            prompts: []
          - id: sms
            title: 短信服务
