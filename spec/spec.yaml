businesses:
  - id: voice
    name: 语音转录
    summary: 空格口述实时上屏；点击录音独立保存本地音频。
    events:
      - id: voice-1
        channel: phone-app
        direction: ab
        title: 本人录音
        body: 麦克风音频进入 App。
        delay: 1700
        status:
          phone.microphone: 正在录音
        after: []
      - id: voice-2
        channel: app-cloud
        direction: ab
        title: 音频＋近期上下文
        body: App 上传本次音频和相关本机前文。
        delay: 1700
        fields:
          音频: 实时分块
          近期上下文: 同会话结果稿
        startStreams:
          - phone-app:ab
          - app-cloud:ab
        status:
          app.history: 选择近期上下文
          cloud.accounts: 预留 / 结算 Credit
        after:
          - voice-1
      - id: voice-3
        channel: cloud-provider
        direction: ab
        title: 实时 ASR 请求
        body: Cloud 取热词，随音频与近期上下文发给语音模型。
        delay: 1700
        fields:
          目标: 语音模型 · Qwen Message
          材料: 音频＋Cloud 热词＋近期上下文
        startStreams:
          - cloud-provider:ab
        status:
          cloud.proxy: 组装语音请求
          cloud.hotwords: 取相关热词
          provider.audio: 实时识别
        after:
          - voice-2
      - id: voice-4
        channel: cloud-provider
        direction: ba
        title: 中间文字
        body: “明天聊豆……”；尚未定稿。
        delay: 1700
        after:
          - voice-3
      - id: voice-5
        channel: app-cloud
        direction: ba
        title: 实时文字
        body: Cloud 将中间文字回传 App。
        delay: 1700
        after:
          - voice-4
      - id: voice-6
        channel: phone-app
        direction: ba
        title: 输入框中的文字
        body: 实时显示，本人可停止或取消。
        delay: 1700
        status:
          phone.chat: 明天聊豆……
        after:
          - voice-5
      - id: voice-7
        channel: cloud-provider
        direction: ba
        title: 最终转写
        body: “明天聊豆包输入法。”＋本次用量。
        delay: 1700
        stopStreams:
          - phone-app:ab
          - app-cloud:ab
          - cloud-provider:ab
        status:
          phone.microphone: 录音结束
          provider.audio: 转写完成
        after:
          - voice-6
      - id: voice-8
        channel: cloud-provider
        direction: ab
        title: 个人改写提示词
        body: 已有个人文风时，Cloud调用文本模型整理；模型改写与本人修改分开。
        delay: 1700
        prompt: rewrite
        fields:
          目标: 文本模型
          材料: ASR 原文＋场景文风＋热词＋近期上下文
        status:
          cloud.style: 取适用场景
          provider.language: 整理文字
        after:
          - voice-7
      - id: voice-9
        channel: cloud-provider
        direction: ba
        title: 整理后的文字
        body: “明天再聊豆包输入法。”；与 ASR 原文分开保留。
        delay: 1700
        after:
          - voice-8
      - id: voice-10
        channel: app-cloud
        direction: ba
        title: 原文＋填入稿
        body: App 保存本条历史；Cloud 按供应商成功用量结算 Credit。
        delay: 1700
        fields:
          ASR原文: 明天聊豆包输入法。
          实际填入稿: 明天再聊豆包输入法。
        status:
          app.history: 保留原文与填入稿
          cloud.accounts: 预留 / 结算 Credit
          cloud.proxy: 请求完成
        after:
          - voice-9
      - id: voice-11
        channel: phone-app
        direction: ba
        title: 实际填入稿
        body: App 填入输入框；结果稿初始化为同一文字，用户不改就保留该值。
        delay: 1700
        fields:
          实际填入稿: 明天再聊豆包输入法。
          结果稿: 明天再聊豆包输入法。
        status:
          phone.chat: 明天再聊豆包输入法。
        after:
          - voice-10
      - id: voice-12
        channel: phone-app
        direction: ab
        title: 本人的修改稿
        body: “豆包”改为“豆豆”；更新同条历史，进入记忆更新队列。
        delay: 1700
