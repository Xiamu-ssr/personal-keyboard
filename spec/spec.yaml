businesses:
  - id: voice
    name: 语音转录
    summary: 同样的域与实体；这次传的是声音、文字和可观察的改稿。
    events:
      - id: voice-1
        title: 本人录音
        body: 麦克风音频进入输入法；未发起录音不采集。
        delay: 1700
        after: []
        status:
          phone.microphone: 正在录音
        channel: phone-app
        direction: ab
      - id: voice-2
        title: 音频＋识别上下文
        body: 上传音频分块、适用热词与近期本人修改稿；热词来自本机缓存，原转写不替代修订稿。
        delay: 1700
        after:
          - voice-1
        startStreams:
          - phone-app:ab
          - app-cloud:ab
        status:
          app.cache: 取缓存热词与近期表达
          cloud.accounts: 校验账户与额度
        channel: app-cloud
        direction: ab
      - id: voice-3
        title: 实时 ASR 请求
        body: 代理带服务端凭据，将音频与识别上下文送往 Qwen Message。
        delay: 1700
        after:
          - voice-2
        startStreams:
          - cloud-provider:ab
        status:
          cloud.proxy: 代理实时音频
          provider.audio: 识别中
        channel: cloud-provider
        direction: ab
      - id: voice-4
        title: 中间文字
        body: “明天聊豆……”；未定稿，不计两遍字符。
        delay: 1700
        after:
          - voice-3
        channel: cloud-provider
        direction: ba
      - id: voice-5
        title: 实时中间结果
        body: Cloud 回传文字片段；网络断开应显示状态。
        delay: 1700
        after:
          - voice-4
        channel: app-cloud
        direction: ba
      - id: voice-6
        title: 输入框中的文字
        body: 本例展示中间结果，用户仍可停止或取消。
        delay: 1700
        after:
          - voice-5
        status:
          phone.chat: 明天聊豆……
        channel: phone-app
        direction: ba
      - id: voice-7
        title: 最终转写
        body: “明天聊豆包输入法。”＋本次 usage。
        delay: 1700
        after:
          - voice-6
        stopStreams:
          - phone-app:ab
          - app-cloud:ab
          - cloud-provider:ab
        status:
          phone.microphone: 已停止
          provider.audio: 完成
        channel: cloud-provider
        direction: ba
      - id: voice-8
        title: 文字结果＋权益余额
        body: 最终 ASR 文字与任务 ID；本机保存原结果，Cloud 结算成功字符。
        delay: 1700
        after:
          - voice-7
        status:
          app.history: 原转写：明天聊豆包输入法。
          cloud.accounts: 按成功最终文字结算
          cloud.proxy: 任务完成
        channel: app-cloud
        direction: ba
      - id: voice-9
        title: 实际填入的版本
        body: 填入当前输入框，不代发。可选个人改写由设置控制。
        delay: 1700
        after:
          - voice-8
        status:
          phone.chat: 用户可继续编辑
        channel: phone-app
        direction: ba
      - id: voice-10
        title: 本人的修改稿
        body: 本人把“豆包”改为“豆豆”；同条历史保留原文、填入基线和最后有效修改稿，不存逐次快照。
        delay: 1700
        after:
          - voice-9
        status:
          app.history: 原文 / 填入稿 / 本人修改稿
          phone.chat: 本人编辑与发送
        channel: phone-app
        direction: ab
      - id: voice-11
        title: 新增 / 修订历史
        body: App 按变化序号上传本批历史 ID、修订和必要片段；示例在输入暂歇时合批，具体参数待定。Cloud 接单后独立运行。
        delay: 1700
        after:
          - voice-10
        proposal: design-options
        status:
          app.history: 变化已入待处理队列
          cloud.proxy: 已接收增量任务
        channel: app-cloud
        direction: ab
      - id: voice-12
        title: 学习提示词＋本批来源
        body: Cloud 读取相关旧记忆和版本，按模型预算分片，加学习提示词 → 文字 LLM；不用每用户 harness。
        delay: 1700
        after:
          - voice-11
        prompt: learn
        status:
          cloud.proxy: 组装本批来源与旧记忆
          provider.language: 提出结构化增删改
        channel: cloud-provider
        direction: ab
      - id: voice-13
        title: 有来源的结构化修改
        body: 示例：新增词条“豆豆”，带词 ID、预期版本与历史来源；本次没有足够文风或人物证据。
        delay: 1700
        after:
          - voice-12
        channel: cloud-provider
        direction: ba
      - id: voice-14
        title: 记忆版本与缓存变更
        body: Cloud 校验来源和版本后将“豆豆”写入热词主本；返回完整变更词条、删除标记和游标，App 更新缓存。
        delay: 1700
        after:
          - voice-13
        status:
          cloud.hotwords: 主本已加入：豆豆 · 可撤销
          cloud.proxy: 事务落库，推进处理位置
          app.cache: 同步完整词条与版本
        channel: app-cloud
        direction: ba
      - id: voice-15
        title: 下次识别的热词与前文
        body: 新录音使用同步后的“豆豆”和近期本人修改稿；Cloud 主本与本机缓存共享稳定词 ID。
        delay: 1700
        after:
          - voice-14
        status:
          app.history: 原始历史仍留本机
          app.cache: 新词用于识别上下文
          cloud.hotwords: 保留来源与版本
        channel: app-cloud
        direction: ab
  - id: advisor
    name: 军师模式
    summary: 截图和历史留手机；Cloud 管理个人记忆，军师一次多模态。
    events:
      - id: advisor-1
        title: 本人触发的聊天截图
        body: 缩矮后截当前屏，截图进入本机历史；普通输入不自动截屏。
        delay: 1700
        after: []
        status:
          phone.chat: 当前屏截图
          app.history: 截图已存本机
        channel: phone-app
        direction: ab
      - id: advisor-2
        title: 截图＋关系＋文风＋近期表达
        body: 上传本次截图、相关人物关系、文风、同对话近期本人修改稿和意图；不附独立热词表。
        delay: 1700
        after:
          - advisor-1
        status:
          app.history: 选择同对话的近期表达
          app.cache: 当前人物与文风缓存
          cloud.accounts: 检查军师权益
        channel: app-cloud
        direction: ab
      - id: advisor-3
        title: 军师提示词＋图文材料
        body: Cloud 代理将军师提示词和图文材料发给视觉语言模型；不做独立 OCR 前置，具体模型待验证。
        delay: 1700
        after:
          - advisor-2
        prompt: reply
        status:
          cloud.proxy: 一次图文请求
          provider.language: 读图并生成建议
        channel: cloud-provider
        direction: ab
      - id: advisor-4
        title: 三条建议＋识别出的聊天内容
        body: 同一次模型返回三条建议、说话人及可见消息；不另跑 OCR，读不清的人物和文字标未知。
        delay: 1700
        after:
          - advisor-3
        channel: cloud-provider
        direction: ba
      - id: advisor-5
        title: 建议与识别出的聊天内容
        body: 本机军师历史关联截图、说话人文字与建议；选中后补上填入稿，用户修改后更新同条历史。
        delay: 1700
        after:
          - advisor-4
        status:
          app.history: 截图 / 聊天内容 / 建议关联
          cloud.accounts: 成功生成扣 1 次
          cloud.proxy: 完成本次请求
        channel: app-cloud
        direction: ba
      - id: advisor-6
        title: 选中的回复
        body: 恢复高度，选一条填入并关联同条军师历史；它也是改稿比较基线，不重复复制“最终答案”。填入不证明发送。
        delay: 1700
        after:
          - advisor-5
        status:
          phone.chat: 选择与发送由本人决定
        channel: phone-app
        direction: ba
      - id: advisor-7
        title: 本人的修改稿
        body: 同条军师历史更新最后有效修改稿，保留截图与选中回复；学习的是本人表达，不将草稿记为对方事实。
        delay: 1700
        after:
          - advisor-6
        status:
          app.history: 截图 / 选中稿 / 本人修改稿
        channel: phone-app
        direction: ab
      - id: advisor-8
        title: 新增的人物与表达证据
        body: 上传变化历史及修订：有说话人的聊天内容、本人选择与修改；Cloud 读取相关旧人物和文风。具体合批参数待定。
        delay: 1700
        after:
          - advisor-7
        proposal: design-options
        channel: app-cloud
        direction: ab
      - id: advisor-9
        title: 学习提示词＋来源材料
        body: Cloud 以人物 ID、事实 ID、文风档案与来源版本组装文字请求；本人陈述与对方发言分别归属。
        delay: 1700
        after:
          - advisor-8
        prompt: learn
        status:
          cloud.proxy: 读取相关旧记忆与版本
          provider.language: 按来源提出更新
        channel: cloud-provider
        direction: ab
      - id: advisor-10
        title: 人物事实 / 文风建议
        body: 示例：人物 P1 的状态事实 F2 为“最近忙”，附截图历史来源与时间；不是永久性格，也不整个人物覆盖。
        delay: 1700
        after:
          - advisor-9
        channel: cloud-provider
        direction: ba
      - id: advisor-11
        title: 个人记忆版本变更
        body: Cloud 校验来源与目标版本，文风变化和人物冲突待确认；提交后同步完整变更记录。App 只更新缓存，不执行 LLM 操作。
        delay: 1700
        after:
          - advisor-10
        status:
          cloud.people: 人物身份 / 独立事实 / 来源
          cloud.style: 文风变化先确认
          app.cache: 完整变更记录已同步
          app.history: 截图继续留本机
        channel: app-cloud
        direction: ba
      - id: advisor-12
        title: 下次取相关个人记忆
        body: 使用当前对象相关事实、本人文风和同对话近期表达；Cloud 保留个人记忆主本，手机保存历史与缓存。
        delay: 1700
        after:
          - advisor-11
        status:
          cloud.people: 已生效事实供下次使用
          app.cache: 人物与文风可离线查看
        channel: app-cloud
        direction: ab
