            - 587
          - - 558
            - 587
          - - 558
            - 650
      - id: relevant
        from: app.memory.relevant
        to: app.batch.relevant
        title: 相关旧记忆
        detail: 只取涉及的词条 / 人物与 baseRevision，不装载全部记忆。
        via:
          - - 766
            - 150
          - - 766
            - 596
      - id: batch
        from: app.batch.upload
        to: cloud.learn.batch
        title: 增量整理任务
        detail: recordId / revision / source spans + 编辑差异 + 相关旧记忆；不是付费整库云备份。
        channel: app-cloud
      - id: learn
        from: cloud.learn.prompt
        to: provider.text.request
        title: 学习提示词 + 本批证据
        detail: 按输入预算分批：纠词、文风、人物事实与忽略项；只引用本批 sourceIds。
        channel: cloud-provider
      - id: proposals
        from: provider.text.result
        to: cloud.learn.candidates
        title: 结构化候选
        detail: 候选包含作用范围、证据定位、基础版本与冲突；模型不能修改设备文件。
        channel: cloud-provider
      - id: patch
        from: cloud.learn.patch
        to: app.memory.patch
        title: 校验后的记忆补丁
        detail: 程序核验来源、作用域、去重和版本；手工资料优先，冲突不覆盖，原历史不删除。
        channel: app-cloud
      - id: rewrite
        from: app.writer.rewrite
        to: cloud.rewrite.request
        title: 个人文风整理
        detail: 用户设置开启时才调用；关闭时直接使用 ASR 最终文字。
        channel: app-cloud
        exitVia:
          - - 558
            - 330
          - - 558
            - 385
          - - 766
            - 385
      - id: rewrite-model
        from: cloud.rewrite.upstream
        to: provider.text.request
        title: 个人改写提示词
        detail: 原转写 + 适用热词 / 文风；不冒充用户编辑证据。
        channel: cloud-provider
      - id: rewritten
        from: provider.text.result
        to: cloud.rewrite.result
        title: 整理后的文字
        detail: 独立保存可选改写版本，原始 ASR 不覆盖。
        channel: cloud-provider
      - id: polished
        from: cloud.rewrite.polished
        to: app.writer.polished
        title: 上屏候选文字
        detail: 保留 rawAsrText，作为 insertedText 的候选；上屏后再观察用户的真实修改。
        channel: app-cloud
        entryVia:
          - - 790
            - 350
          - - 790
            - 380
          - - 558
            - 380
          - - 558
            - 330
