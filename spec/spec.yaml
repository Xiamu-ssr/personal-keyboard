businesses:
  - id: voice
    name: 语音转录
    summary: 同样的域与实体；这次传的是声音、文字和可观察的改稿。
    events:
      - id: voice-1
        title: 本人录音
        body: 麦克风音频进入输入法；未发起录音不采集。
        delay: 1700
        after: []
        status:
          phone.microphone: 正在录音
        channel: phone-app
        direction: ab
      - id: voice-2
        title: 音频＋识别上下文
        body: 音频分块、适用热词和少量近期文字；不是整库历史。
        delay: 1700
        after:
          - voice-1
        startStreams:
          - phone-app:ab
          - app-cloud:ab
        status:
          app.hotwords: 取已启用词条
          cloud.accounts: 校验账户与可用额度
        channel: app-cloud
        direction: ab
      - id: voice-3
        title: 实时 ASR 请求
        body: 代理带服务端凭据，将音频与识别上下文送往 Qwen Message。
        delay: 1700
        after:
          - voice-2
        startStreams:
          - cloud-provider:ab
        status:
          cloud.proxy: 代理实时音频
          provider.audio: 识别中
        channel: cloud-provider
        direction: ab
      - id: voice-4
        title: 中间文字
        body: “明天聊豆……”；未定稿，不计两遍字符。
        delay: 1700
        after:
          - voice-3
        channel: cloud-provider
        direction: ba
      - id: voice-5
        title: 实时中间结果
        body: Cloud 回传文字片段；网络断开应显示状态。
        delay: 1700
        after:
          - voice-4
        channel: app-cloud
        direction: ba
      - id: voice-6
        title: 输入框中的文字
        body: 本例展示中间结果，用户仍可停止或取消。
        delay: 1700
        after:
          - voice-5
        status:
          phone.chat: 明天聊豆……
        channel: phone-app
        direction: ba
      - id: voice-7
        title: 最终转写
        body: “明天聊豆包输入法。”＋本次 usage。
        delay: 1700
        after:
          - voice-6
        stopStreams:
          - phone-app:ab
          - app-cloud:ab
          - cloud-provider:ab
        status:
          phone.microphone: 已停止
          provider.audio: 完成
        channel: cloud-provider
        direction: ba
      - id: voice-8
        title: 文字结果＋权益余额
        body: 最终 ASR 文字与任务 ID；本机保存原结果，Cloud 结算成功字符。
        delay: 1700
        after:
          - voice-7
        status:
          app.history: 原转写：明天聊豆包输入法。
          cloud.accounts: 按成功最终文字结算
          cloud.proxy: 任务完成
        channel: app-cloud
        direction: ba
      - id: voice-9
        title: 实际填入的版本
        body: 填入当前输入框，不代发。可选个人改写由设置控制。
        delay: 1700
        after:
          - voice-8
        status:
          phone.chat: 用户可继续编辑
        channel: phone-app
        direction: ba
      - id: voice-10
        title: 可观察的用户改稿
        body: 示例把“豆包”改为“豆豆”；附在同一条历史，不能称作发送回执。
        delay: 1700
        after:
          - voice-9
        proposal: design-options
        status:
          app.history: 原文 + 最后观察改稿
          phone.chat: 清空后发送状态未知
        channel: phone-app
        direction: ab
      - id: voice-11
        title: 建议：新增学习材料
        body: 有新增证据且空闲 / 预算允许时，取未处理片段和相关旧记忆；不是每五小时全库上传。
        delay: 1700
        after:
          - voice-10
        proposal: design-options
        status:
          cloud.proxy: 增量整理示例
        channel: app-cloud
        direction: ab
      - id: voice-12
        title: 学习提示词＋本批来源
        body: 文字模型只提取热词 / 文风 / 人物候选，引用具体来源。
        delay: 1700
        after:
          - voice-11
        proposal: design-options
        prompt: learn
        status:
          provider.language: 提取有来源的候选
        channel: cloud-provider
        direction: ab
      - id: voice-13
        title: 结构化候选
        body: 示例：专有词“豆豆”；本次不够推导长期文风，也没有对方人物事实。
        delay: 1700
        after:
          - voice-12
        proposal: design-options
        channel: cloud-provider
        direction: ba
      - id: voice-14
        title: 带来源的记忆更新
        body: 本机核对来源：明确纠词“豆豆”自动入词且可撤销；文风变化与人物冲突先确认。
        delay: 1700
        after:
          - voice-13
        proposal: design-options
        status:
          app.hotwords: 自动加入：豆豆 · 可撤销
          app.style: 不因一次改词改变
          app.people: 本次没有人物来源
          cloud.proxy: 返回候选，不写设备目录
        channel: app-cloud
        direction: ba
      - id: voice-15
        title: 下一次的识别上下文
        body: 带上已经生效的适用热词与近期文字；本例加入的“豆豆”供下一次识别使用。
        delay: 1700
        after:
          - voice-14
        proposal: design-options
        status:
          app.history: 原始历史仍保留
          app.hotwords: 已生效热词反哺识别
        channel: app-cloud
        direction: ab
  - id: advisor
    name: 军师模式
    summary: 相同的域与实体；军师直接看图，数据主本留在手机，学习参数尚待定。
    events:
      - id: advisor-1
        title: 本人触发的聊天截图
        body: 缩矮后截当前屏，截图进入本机历史；普通输入不自动截屏。
        delay: 1700
        after: []
        status:
          phone.chat: 当前屏截图
          app.history: 截图已存本机
        channel: phone-app
        direction: ab
      - id: advisor-2
        title: 截图＋意图＋相关记忆
        body: 已选直接多模态；上传本次截图、意图、相关热词 / 文风 / 人物，不上传整个资料库。
        delay: 1700
        after:
          - advisor-1
        status:
          app.hotwords: 本次相关称呼
          app.style: 本人的表达偏好
          app.people: 当前人物的相关记忆
          cloud.accounts: 检查军师权益
        channel: app-cloud
        direction: ab
      - id: advisor-3
        title: 军师提示词＋图文材料
        body: Cloud 代理将军师提示词和图文材料发给视觉语言模型；不做独立 OCR 前置，具体模型待验证。
        delay: 1700
        after:
          - advisor-2
        prompt: reply
        status:
          cloud.proxy: 一次图文请求
          provider.language: 读图并生成建议
        channel: cloud-provider
        direction: ab
      - id: advisor-4
        title: 三条建议＋文字证据
        body: 模型返回说话人归属、可见消息与三种表达；读不清或认不出人物必须标未知。
        delay: 1700
        after:
          - advisor-3
        channel: cloud-provider
        direction: ba
      - id: advisor-5
        title: 回复与本次上下文
        body: 本机历史关联截图、模型读出的文字及建议；文字识别结果可能出错。
        delay: 1700
        after:
          - advisor-4
        status:
          app.history: 截图与本次建议关联
          cloud.accounts: 成功生成扣 1 次
          cloud.proxy: 完成本次请求
        channel: app-cloud
        direction: ba
      - id: advisor-6
        title: 选中的回复
        body: 恢复键区高度，选一条填入；不证明已发送，也不是对方说过的话。
        delay: 1700
        after:
          - advisor-5
        status:
          phone.chat: 选择与发送由本人决定
        channel: phone-app
        direction: ba
      - id: advisor-7
        title: 可观察的本人改稿
        body: 如果能可靠归属本次填入，将改稿附在同一记录；不记录每一次击键。
        delay: 1700
        after:
          - advisor-6
        status:
          app.history: 建议 + 本人观察改稿
        channel: phone-app
        direction: ab
      - id: advisor-8
        title: 建议：本次新增证据
        body: 截图抽出的有归属文字和本人改稿分来源上传；人物不明时不强行归档。
        delay: 1700
        after:
          - advisor-7
        proposal: design-options
        channel: app-cloud
        direction: ab
      - id: advisor-9
        title: 学习提示词＋来源材料
        body: 截图可支持对方事实，本人陈述也可支持已明确指向的人物；建议与草稿不冒充对方事实。
        delay: 1700
        after:
          - advisor-8
        proposal: design-options
        prompt: learn
        status:
          provider.language: 按人物与来源提取
        channel: cloud-provider
        direction: ab
      - id: advisor-10
        title: 人物 / 文风候选
        body: 示例：“对方说最近忙，来源是截图”；不推成永久性格，也不推成已发生事件。
        delay: 1700
        after:
          - advisor-9
        proposal: design-options
        channel: cloud-provider
        direction: ba
      - id: advisor-11
        title: 有来源的记忆候选
        body: 本机核对来源与人物；文风变化和人物冲突先确认，不覆盖手动资料。
        delay: 1700
        after:
          - advisor-10
        proposal: design-options
        status:
          app.people: 候选附原截图来源
          app.style: 只取本人的表达信号
          app.history: 截图继续留在本机
