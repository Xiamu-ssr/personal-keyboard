        from: cloud.quota.verdict
        to: cloud.asr.grant
        title: 可用权益
        detail: 返回本次任务许可；原任务重试不重复预留。
      - id: model
        from: cloud.asr.upstream
        to: provider.asr.request
        title: 实时识别音频
        detail: 音频沿同一条供应商连接持续流动。
        channel: cloud-provider
      - id: model-result
        from: provider.asr.result
        to: cloud.asr.upstreamResult
        title: 实时 / 最终转写
        detail: 句子标识、修订、中间文字与最终文字。
        channel: cloud-provider
      - id: result
        from: cloud.asr.result
        to: app.writer.result
        title: 转写结果
