pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
    maven { url 'https://maven.aliyun.com/repository/public'; content { includeGroup 'com.github.promeg' } }
  }
}
rootProject.name = 'DoudouKeyboard'
include ':app'
