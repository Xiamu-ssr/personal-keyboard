plugins { id 'com.android.application' }

def contractAssets = layout.buildDirectory.dir('generated/model-contract-assets')
tasks.register('generateModelContracts', Copy) {
    from rootProject.file('../cloud/contracts/palette.json')
    from rootProject.file('../cloud/contracts/translation.json')
    from rootProject.file('../cloud/contracts/person.json')
    into contractAssets
}

android {
    namespace 'app.doudou.ime'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'app.doudou.ime'
        minSdk 30
        targetSdk 35
        versionCode 20
        versionName '0.9.5-alpha.2'
        buildConfigField 'String', 'API_BASE_URL', '"https://106.14.88.147/keyboard-api"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir(contractAssets)
    buildTypes { release { minifyEnabled false } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    testOptions { unitTests.returnDefaultValues = true; unitTests.all { jvmArgs '-Djava.library.path=' + rootProject.file('../.runtime/native-host').absolutePath } }
}
tasks.named('preBuild').configure { dependsOn tasks.named('generateModelContracts') }
dependencies {
    // WorkManager exposes ListenableFuture; the picker also brings Guava at runtime.
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation 'androidx.emoji2:emoji2-bundled:1.7.0'
    implementation 'androidx.emoji2:emoji2-views:1.7.0'
    implementation 'androidx.emoji2:emoji2-emojipicker:1.7.0'
    implementation 'com.github.promeg:tinypinyin:2.0.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
