plugins { id 'com.android.application' }

def paletteAssets = layout.buildDirectory.dir('generated/palette-assets')
tasks.register('generatePaletteContract', Copy) {
    from rootProject.file('../cloud/contracts/palette.json')
    into paletteAssets
}

android {
    namespace 'app.doudou.ime'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'app.doudou.ime'
        minSdk 30
        targetSdk 35
        versionCode 14
        versionName '0.9.0-alpha.1'
        buildConfigField 'String', 'API_BASE_URL', '"https://106.14.88.147/keyboard-api"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir(paletteAssets)
    buildTypes { release { minifyEnabled false } }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    testOptions { unitTests.returnDefaultValues = true; unitTests.all { jvmArgs '-Djava.library.path=' + rootProject.file('../.runtime/native-host').absolutePath } }
}
tasks.named('preBuild').configure { dependsOn tasks.named('generatePaletteContract') }
dependencies {
    implementation 'com.github.promeg:tinypinyin:2.0.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
