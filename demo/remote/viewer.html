<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>豆豆输入法 · 实机演示</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body,
    main {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #171717;
      color: #eee;
      font: 16px system-ui;
    }
    main {
      display: grid;
      place-items: center;
      position: relative;
    }
    #waiting {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
    }
    #message {
      line-height: 1.6;
    }
    #spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #555;
      border-top-color: #eee;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #171717;
    }
    button {
      font: inherit;
      border: 1px solid #555;
      background: #333;
      color: #eee;
      border-radius: 22px;
      padding: 10px 22px;
      cursor: pointer;
    }
    #stop {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 2;
      font-size: 13px;
      padding: 8px 14px;
    }
    body.embed #stop {
      display: none;
    }
    [hidden] {
      display: none !important;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #spinner {
        animation: none;
      }
    }
  </style>
  <main>
    <div id="waiting">
      <span id="spinner" aria-hidden="true"></span>
      <div id="message" role="status">正在启动 Android…</div>
      <button id="retry" hidden>重试</button>
    </div>
    <iframe id="screen" title="安卓实机" hidden allow="fullscreen"></iframe>
    <button id="stop" hidden>结束演示</button>
  </main>
  <script>
    const by = (id) => document.getElementById(id);
    let session = "",
      busy = false,
      closed = false,
      shutdownRequest = null;
    try {
      session = sessionStorage.getItem("keyboard-demo-session") || "";
    } catch {}
    if (window !== parent) document.body.classList.add("embed");
    if (location.hash)
      history.replaceState(null, "", location.pathname + location.search);
    const report = (phase) =>
      parent !== window &&
      parent.postMessage({ type: "keyboard-demo:state", phase }, "*");
    async function api(name, body, keepalive = false) {
      const r = await fetch("api/" + name, {
        method: body ? "POST" : "GET",
        headers: {
          "Content-Type": "application/json",
          "X-Demo-Session": session,
        },
        body: body ? JSON.stringify(body) : undefined,
        keepalive,
      });
      if (!(r.headers.get("content-type") || "").includes("application/json"))
        throw Error("演示暂时离线");
      const d = await r.json();
      if (!r.ok) {
        const e = Error(d.error || "演示暂时离线");
        e.status = r.status;
        throw e;
      }
      return d;
    }
    function waiting(message, retry = false) {
      by("waiting").hidden = false;
      by("message").textContent = message;
      by("spinner").hidden = retry;
      by("retry").hidden = !retry;
      report(retry ? "error" : "starting");
    }
    async function boot() {
      if (busy) return;
      busy = true;
      closed = false;
      shutdownRequest = null;
      by("screen").hidden = true;
      by("stop").hidden = true;
      waiting("正在启动 Android…");
      try {
        let state;
        if (session) {
          try {
            state = await api("status");
          } catch (e) {
            if (e.status !== 401) throw e;
            session = "";
          }
        }
        if (!session) {
          const d = await api("session", {});
          session = d.session;
          try {
            sessionStorage.setItem("keyboard-demo-session", session);
          } catch {}
        }
        if (closed) return;
        state = state || (await api("status"));
        if (state.phase === "occupied") throw Error("有人正在体验，请稍后重试");
        if (state.phase !== "running") state = await api("start", {});
        if (closed) return;
        if (!state.viewer) throw Error("演示已结束，请重试");
        by("screen").src = state.viewer;
        by("screen").hidden = false;
        by("stop").hidden = false;
      } catch (e) {
        if (!closed) {
          by("screen").hidden = true;
          waiting(e.message, true);
        }
      } finally {
        busy = false;
      }
    }
    function shutdown() {
      if (shutdownRequest) return shutdownRequest;
      closed = true;
      report("stopping");
      by("screen").hidden = true;
      by("screen").removeAttribute("src");
      by("stop").hidden = true;
      shutdownRequest = session
        ? api("stop", {}, true).catch(() => {})
        : Promise.resolve();
      if (window !== parent)
        parent.postMessage({ type: "keyboard-demo:closing" }, "*");
      shutdownRequest.then(() => {
        by("waiting").hidden = false;
        by("message").textContent = "演示已结束";
        by("spinner").hidden = true;
        by("retry").hidden = false;
        report("stopped");
      });
      return shutdownRequest;
    }
    window.addEventListener("message", (e) => {
      if (
        e.source === by("screen").contentWindow &&
        e.origin === location.origin &&
        e.data?.type === "keyboard-demo:video-ready"
      ) {
        by("waiting").hidden = true;
        report("running");
        return;
      }
      if (
        e.source !== parent ||
        ![location.origin, "https://xiamu-ssr.github.io"].includes(e.origin)
      )
        return;
      if (e.data?.type === "keyboard-demo:stop") shutdown();
    });
    by("retry").onclick = boot;
    by("stop").onclick = shutdown;
    window.addEventListener("pagehide", shutdown);
    setInterval(async () => {
      if (closed || busy || document.hidden || !session) return;
      try {
        const d = await api("ping", {});
        if (d.phase === "stopped") {
          by("screen").hidden = true;
          by("screen").removeAttribute("src");
          waiting("演示已结束", true);
        }
      } catch {}
    }, 20_000);
    boot();
  </script>
</html>
